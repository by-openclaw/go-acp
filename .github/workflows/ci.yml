name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One live run per ref: a new push to a PR branch cancels the in-progress
# run on the outdated commit (no more two same-titled rows per PR). Runs on
# main are NEVER cancelled — every merge commit keeps its own complete
# verification (a cancelled main run would hide a real red).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.23"]
    steps:
      - uses: actions/checkout@v4
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Go mod tidy
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          # A few consumer/provider tests exercise goroutine / reconnect /
          # timer timing (net.Pipe, fast reconnect backoff, keep-alive) that
          # can flake on a loaded CI runner even when the code is correct —
          # the same class the coverage-floor step already retries. Retry the
          # suite up to 3x and pass on the first green; a genuine failure
          # fails all three attempts. Root-causing individual flakes is still
          # tracked separately — this only stops them gating merges.
          for attempt in 1 2 3; do
            echo "::group::unit tests (attempt $attempt/3)"
            if go test -count=1 -race ./...; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::unit tests failed on attempt $attempt/3; retrying"
          done
          echo "::error::unit tests failed after 3 attempts"
          exit 1

      - name: Unit tests (coverage)
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -coverprofile=coverage.out ./...

      # Per-package coverage floor for the gold-template connectors. Fails
      # the build if a package drops below its locked-in level (no-regression).
      # Raise these as the tiered coverage push lands (see issues #539, #550).
      - name: Coverage floor (acp1 + acp2 + emberplus)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          # Concurrency packages (consumer/provider) have goroutine/timer
          # branches whose statement coverage depends on scheduling, so a
          # single run on a loaded CI runner can leave a genuinely-coverable
          # line uncovered — and because a loaded runner stays loaded, the
          # same line can miss on all three consecutive attempts (a plain
          # retry then fails even though the code is 100%-coverable).
          #
          # Fix: UNION the coverage profiles across up to 5 attempts. A
          # statement is counted covered if it was hit in ANY attempt, so a
          # line that is coverable at all converges into the union within a few
          # runs; the loop returns early as soon as the union meets the floor,
          # so non-flaky packages still cost one run. With per-run miss rate p
          # for a scheduling-dependent line, a 5-attempt union false-fails with
          # probability ~p^5 (e.g. p=0.2 -> 3e-4). The 100% bar stays genuine:
          # a line no test can EVER reach is absent from every profile, so the
          # union stays below the floor and fails all five attempts.
          #
          # When it does fail, we print the exact uncovered file:line blocks
          # from the union — so a genuine gap (or a stubborn scheduling line) is
          # named and fixed deterministically instead of being a mystery retry.
          #
          # union_pct FILE...       -> prints the unioned statement coverage %.
          # union_uncovered FILE... -> prints the blocks uncovered in the union.
          # Coverprofile rows are "pkg/file.go:sL.sC,eL.eC <numStmt> <count>";
          # the first line ("mode: set") is skipped per file.
          union_pct() {
            awk '
              FNR==1 { next }
              { stmts[$1]=$2; if ($3+0>0) covered[$1]=1 }
              END {
                tot=0; cov=0
                for (k in stmts) { tot+=stmts[k]; if (k in covered) cov+=stmts[k] }
                if (tot==0) { print "100.0"; exit }
                printf "%.1f\n", 100*cov/tot
              }
            ' "$@"
          }
          union_uncovered() {
            awk '
              FNR==1 { next }
              { stmts[$1]=$2; if ($3+0>0) covered[$1]=1 }
              END { for (k in stmts) if (!(k in covered)) print "    " k "  (" stmts[k] " stmt)" }
            ' "$@" | sort
          }
          check() {
            local pkg=$1 floor=$2 pct tag
            tag=$(printf '%s' "$pkg" | tr '/.' '__')
            local profs=()
            for attempt in 1 2 3 4 5; do
              local pf="cov_${tag}.${attempt}.out"
              go test -count=1 -covermode=set -coverprofile="$pf" "$pkg" >/dev/null
              profs+=("$pf")
              pct=$(union_pct "${profs[@]}")
              printf '%s: union %s%% (floor %s%%, after attempt %s)\n' "$pkg" "$pct" "$floor" "$attempt"
              if awk "BEGIN{exit !(${pct:-0}+0 >= $floor)}"; then return 0; fi
            done
            echo "::error::$pkg union coverage ${pct}% below floor $floor% after 5 attempts"
            echo "uncovered blocks in the 5-attempt union (cover these deterministically):"
            union_uncovered "${profs[@]}"
            exit 1
          }
          check ./internal/acp1/codec 100
          check ./internal/acp1/consumer 100
          check ./internal/acp1/provider 100
          check ./internal/acp2/codec 100
          check ./internal/acp2/consumer 100
          check ./internal/acp2/provider 100
          check ./internal/emberplus/codec/ber 100
          check ./internal/emberplus/codec/glow 100
          check ./internal/emberplus/codec/matrix 100
          check ./internal/emberplus/codec/s101 100
          check ./internal/emberplus/consumer 100
          check ./internal/emberplus/provider 100
          check ./internal/probel-sw02p/codec 100
          check ./internal/probel-sw02p/consumer 100
          check ./internal/probel-sw02p/provider 100
          check ./internal/probel-sw08p/codec 100
          check ./internal/probel-sw08p/consumer 100
          check ./internal/probel-sw08p/provider 100
          check ./internal/tsl/codec 100
          check ./internal/tsl/consumer 100
          check ./internal/tsl/provider 100
          check ./internal/osc/codec 100
          check ./internal/osc/consumer 100
          check ./internal/osc/provider 100
          check ./internal/cerebrum-nb/codec 100
          check ./internal/cerebrum-nb/codec/ws 100
          check ./internal/cerebrum-nb/consumer 100

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  test-rhel:
    name: Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: rocky9
            image: rockylinux:9
          - distro: rhel9-ubi
            image: redhat/ubi9:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git + git-lfs
        run: dnf install -y git git-lfs

      - uses: actions/checkout@v4
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Vet
        run: go vet ./...

      # Same 3-attempt retry as the main test matrix — the container jobs
      # were the one place a timing flake could still gate a merge (live
      # case 2026-08-17: TestRunDiagnostics_ConnectionClosed on rocky9
      # reddened a main push that every other platform passed).
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::unit tests (attempt $attempt/3)"
            if go test -count=1 ./...; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::unit tests failed on attempt $attempt/3; retrying"
          done
          echo "::error::unit tests failed after 3 attempts"
          exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6

  build-all:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: [test, test-rhel, lint]
    steps:
      - uses: actions/checkout@v4
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build all targets
        run: |
          VERSION=$(git describe --tags --dirty --always)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              EXT=""
              if [ "$GOOS" = "windows" ] && [ "$GOARCH" = "arm64" ]; then continue; fi
              if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
              echo "Building ${GOOS}/${GOARCH}..."
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "${LDFLAGS}" \
                -o "dist/dhs_${GOOS}_${GOARCH}/dhs${EXT}" ./cmd/dhs
            done
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  # ---- Release (push-to-main only, AFTER everything is green) -------------
  # One workflow = one action run per commit, and releasing on red is
  # structurally impossible: release-please bookkeeping (and the version
  # tag it eventually creates when its release PR merges) only runs behind
  # the full test/lint/cross-compile gate. Formerly a separate release.yml
  # sharing the push:main trigger — every merge showed two same-titled runs
  # and the release path never waited for CI (#690).
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: [test, test-rhel, lint, build-all]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build release binaries
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # Embed the Windows .exe version resource (CompanyName / ProductName /
      # FileVersion / LegalCopyright shown in the Properties dialog) from
      # cmd/dhs/winres/winres.json. go-winres writes a GOOS=windows .syso that
      # `go build` links automatically for windows targets only; other GOOS
      # builds ignore it. Best-effort — a tooling hiccup must never block a
      # release, the .exe just ships without the resource.
      - name: Embed Windows version resource
        run: |
          VERSION=${{ needs.release-please.outputs.tag_name }}
          NUMVER=${VERSION#v}
          go install github.com/tc-hib/go-winres@v0.3.3 || true
          if command -v go-winres >/dev/null 2>&1; then
            go-winres make --in cmd/dhs/winres/winres.json \
              --product-version "${NUMVER}" --file-version "${NUMVER}" \
              --out cmd/dhs/rsrc || echo "go-winres failed — windows .exe will lack the version resource"
          else
            echo "go-winres not installed — windows .exe will lack the version resource"
          fi

      - name: Build all targets
        run: |
          VERSION=${{ needs.release-please.outputs.tag_name }}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              if [ "$GOOS" = "windows" ] && [ "$GOARCH" = "arm64" ]; then continue; fi
              EXT=""; if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
              DIR="dist/dhs_${GOOS}_${GOARCH}"
              mkdir -p "$DIR"
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "${LDFLAGS}" \
                -o "${DIR}/dhs${EXT}" ./cmd/dhs
            done
          done

      # Authenticode-sign the Windows binaries. Gated on the WINDOWS_CERT_PFX_B64
      # secret (base64-encoded .pfx) + WINDOWS_CERT_PASSWORD — skipped cleanly
      # when unset so releases work without a cert, and switch on the moment the
      # secrets are added. Uses osslsigncode (Linux-runnable).
      - name: Sign Windows binaries
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "${PFX_B64}" ]; then
            echo "WINDOWS_CERT_PFX_B64 not set — skipping Authenticode signing"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y osslsigncode
          echo "${PFX_B64}" | base64 -d > /tmp/cert.pfx
          for exe in dist/dhs_windows_*/dhs.exe; do
            osslsigncode sign -pkcs12 /tmp/cert.pfx -pass "${PFX_PASS}" \
              -n "Device Hub Systems" -i https://www.by-systems.be \
              -t http://timestamp.digicert.com -in "$exe" -out "${exe}.signed"
            mv "${exe}.signed" "$exe"
          done
          rm -f /tmp/cert.pfx

      - name: Package archives
        run: |
          cd dist
          for d in dhs_linux_* dhs_darwin_*; do
            tar -czf "${d}.tar.gz" "$d"
          done
          for d in dhs_windows_*; do
            zip -qr "${d}.zip" "$d"
          done

      # Provenance: a SHA-256 manifest of every artifact so downloaders can
      # verify integrity (and a basis for future SLSA attestation).
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
