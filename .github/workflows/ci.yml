name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.22"]
    steps:
      - uses: actions/checkout@v4
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Go mod tidy
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 -race ./...

      - name: Unit tests (coverage)
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -coverprofile=coverage.out ./...

      # Per-package coverage floor for the gold-template connectors. Fails
      # the build if a package drops below its locked-in level (no-regression).
      # Raise these as the tiered coverage push lands (see issues #539, #550).
      - name: Coverage floor (acp1 + acp2 + emberplus)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          # Concurrency packages (consumer/provider) have goroutine/timer
          # branches whose statement coverage depends on scheduling, so a
          # single run on a loaded CI runner can dip ~0.1% even though the
          # code is genuinely 100%-coverable (verified repeatedly locally).
          # Retry up to 3x and pass on the first run that meets the floor;
          # a real regression fails all three. The bar is still a genuine
          # 100% — this only stabilises the measurement of timing branches.
          check() {
            local pct
            for attempt in 1 2 3; do
              pct=$(go test -count=1 -cover "$1" | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')
              printf '%s: %s%% (floor %s%%, attempt %s)\n' "$1" "$pct" "$2" "$attempt"
              if awk "BEGIN{exit !(${pct:-0}+0 >= $2)}"; then return 0; fi
            done
            echo "::error::$1 coverage ${pct}% below floor $2% after 3 attempts"
            exit 1
          }
          check ./internal/acp1/codec 100
          check ./internal/acp1/consumer 100
          check ./internal/acp1/provider 100
          check ./internal/acp2/codec 100
          check ./internal/acp2/consumer 100
          check ./internal/acp2/provider 100
          check ./internal/emberplus/codec/ber 100
          check ./internal/emberplus/codec/glow 100
          check ./internal/emberplus/codec/matrix 100
          check ./internal/emberplus/codec/s101 100
          check ./internal/emberplus/consumer 100
          check ./internal/emberplus/provider 100
          check ./internal/probel-sw02p/codec 100
          check ./internal/probel-sw02p/consumer 100
          check ./internal/probel-sw02p/provider 100
          check ./internal/probel-sw08p/codec 100
          check ./internal/probel-sw08p/consumer 100
          check ./internal/probel-sw08p/provider 100

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  test-rhel:
    name: Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: rocky9
            image: rockylinux:9
          - distro: rhel9-ubi
            image: redhat/ubi9:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git + git-lfs
        run: dnf install -y git git-lfs

      - uses: actions/checkout@v4
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6

  build-all:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: [test, test-rhel, lint]
    steps:
      - uses: actions/checkout@v4
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build all targets
        run: |
          VERSION=$(git describe --tags --dirty --always)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              EXT=""
              if [ "$GOOS" = "windows" ] && [ "$GOARCH" = "arm64" ]; then continue; fi
              if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
              echo "Building ${GOOS}/${GOARCH}..."
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "${LDFLAGS}" \
                -o "dist/dhs_${GOOS}_${GOARCH}/dhs${EXT}" ./cmd/dhs
            done
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
