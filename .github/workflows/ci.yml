name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # The release-please PR touches ONLY these two bot-owned files and is
    # re-force-pushed on every merge to main; each force-push spawned a CI
    # run that parked at action_required (bot-authored PR + workflow
    # approval policy) — pure noise, never green (ADR-0029 revision
    # 2026-08-19). Skipping the PR event for exactly these files kills
    # that. Push-to-main verification is untouched: the release merge
    # commit still gets its own complete run.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json

# One live run per ref: a new push to a PR branch cancels the in-progress
# run on the outdated commit (no more two same-titled rows per PR). Runs on
# main are NEVER cancelled — every merge commit keeps its own complete
# verification (a cancelled main run would hide a real red).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      # Restore the Go module/build cache BEFORE Go runs: Go >= 1.23 drops
      # golang.org/x/telemetry/config into GOMODCACHE on first go env, and
      # setup-go's own restore (which runs after that) then dies with
      # 'tar: File exists' on every job (#794). Per-job (+matrix) keys stop the
      # 'Unable to reserve cache' races between jobs sharing one key.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: go-${{ runner.os }}-${{ github.job }}${{ matrix.distro }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}${{ matrix.distro }}-

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go mod tidy
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # One pass, no retries (ADR-0029): the timing flakes that motivated
      # the old 3-attempt loop were root-caused and fixed deterministically
      # (acp2 waiter-death protocol, probel-sw02p pre-bound listener). A red
      # here is a real problem in this commit.
      - name: Unit tests
        run: go test -count=1 -race ./...

      - name: Unit tests (coverage)
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -coverprofile=coverage.out ./...

      # Per-package coverage floor for the gold-template connectors. Fails
      # the build if a package drops below its locked-in level (no-regression).
      # Computed from the single whole-repo profile above — no per-package
      # re-runs, no retries, no union (ADR-0029): statement coverage is
      # deterministic by test design (no racy select arms, injectable
      # timings, pre-bound listeners). Package rows are selected by
      # "^dhs/<pkg>/<file>.go:" so nested packages stay separate; a floor
      # package with no rows at all is a hard failure (renamed package
      # guard). On a miss the exact uncovered blocks are printed.
      - name: Coverage floor (acp1 + acp2 + emberplus)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          pkg_pct() {   # pkg_pct <pkg-path>  ->  "<pct> <rows>"
            awk -v pkg="$1" '
              BEGIN { re = "^dhs/" pkg "/[^/]+\\.go:" }
              $0 !~ re { next }
              { stmts[$1]=$2; if ($3+0>0) covered[$1]=1; rows++ }
              END {
                tot=0; cov=0
                for (k in stmts) { tot+=stmts[k]; if (k in covered) cov+=stmts[k] }
                if (tot==0) { print "0.0 0"; exit }
                printf "%.1f %d\n", 100*cov/tot, rows
              }
            ' coverage.out
          }
          pkg_uncovered() {
            awk -v pkg="$1" '
              BEGIN { re = "^dhs/" pkg "/[^/]+\\.go:" }
              $0 !~ re { next }
              $2+0 == 0 { next }   # zero-statement blocks cannot affect the pct
              { stmts[$1]=$2; if ($3+0>0) covered[$1]=1 }
              END { for (k in stmts) if (!(k in covered)) print "    " k "  (" stmts[k] " stmt)" }
            ' coverage.out | sort
          }
          fail=0
          check() {
            local pkg=$1 floor=$2 pct rows
            read -r pct rows <<<"$(pkg_pct "$pkg")"
            if [ "$rows" = "0" ]; then
              echo "::error::$pkg has no rows in coverage.out (package renamed or untested?)"
              fail=1
              return
            fi
            printf '%s: %s%% (floor %s%%, %s blocks)\n' "$pkg" "$pct" "$floor" "$rows"
            if ! awk "BEGIN{exit !(${pct:-0}+0 >= $floor)}"; then
              echo "::error::$pkg coverage ${pct}% below floor $floor%"
              echo "uncovered blocks (cover these deterministically):"
              pkg_uncovered "$pkg"
              fail=1
            fi
          }
          check internal/acp1/codec 100
          check internal/acp1/consumer 100
          check internal/acp1/provider 100
          check internal/acp2/codec 100
          check internal/acp2/consumer 100
          check internal/acp2/provider 100
          check internal/emberplus/codec/ber 100
          check internal/emberplus/codec/glow 100
          check internal/emberplus/codec/matrix 100
          check internal/emberplus/codec/s101 100
          check internal/emberplus/consumer 100
          check internal/emberplus/provider 100
          check internal/probel-sw02p/codec 100
          check internal/probel-sw02p/consumer 100
          check internal/probel-sw02p/provider 100
          check internal/probel-sw08p/codec 100
          check internal/probel-sw08p/consumer 100
          check internal/probel-sw08p/provider 100
          check internal/tsl/codec 100
          check internal/tsl/consumer 100
          check internal/tsl/provider 100
          check internal/osc/codec 100
          check internal/osc/consumer 100
          check internal/osc/provider 100
          check internal/cerebrum-nb/codec 100
          check internal/cerebrum-nb/codec/ws 100
          check internal/cerebrum-nb/consumer 100
          exit $fail

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  test-rhel:
    name: Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: rocky9
            image: rockylinux:9
          - distro: rhel9-ubi
            image: redhat/ubi9:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git + git-lfs
        run: dnf install -y git git-lfs

      - uses: actions/checkout@v7
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Restore the Go module/build cache BEFORE Go runs: Go >= 1.23 drops
      # golang.org/x/telemetry/config into GOMODCACHE on first go env, and
      # setup-go's own restore (which runs after that) then dies with
      # 'tar: File exists' on every job (#794). Per-job (+matrix) keys stop the
      # 'Unable to reserve cache' races between jobs sharing one key.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: go-${{ runner.os }}-${{ github.job }}${{ matrix.distro }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}${{ matrix.distro }}-

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Vet
        run: go vet ./...

      # One pass, no retries (ADR-0029). The live case that motivated the
      # old 3-attempt loop (TestRunDiagnostics_ConnectionClosed on rocky9,
      # 2026-08-17) was root-caused: a select racing a ready reply channel
      # against a closed done channel — fixed with the deterministic
      # waiter-death protocol in internal/acp2/consumer.
      - name: Unit tests
        run: go test -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      # Restore the Go module/build cache BEFORE Go runs: Go >= 1.23 drops
      # golang.org/x/telemetry/config into GOMODCACHE on first go env, and
      # setup-go's own restore (which runs after that) then dies with
      # 'tar: File exists' on every job (#794). Per-job (+matrix) keys stop the
      # 'Unable to reserve cache' races between jobs sharing one key.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: go-${{ runner.os }}-${{ github.job }}${{ matrix.distro }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}${{ matrix.distro }}-

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6

  build-all:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: [test, test-rhel, lint]
    steps:
      - uses: actions/checkout@v7
        with:
          # LFS disabled (free plan quota hit). CI jobs only need Go
          # source to build/test/lint; LFS'd assets/** PDFs and vendor
          # binaries are not read during the build.
          lfs: false

      # Restore the Go module/build cache BEFORE Go runs: Go >= 1.23 drops
      # golang.org/x/telemetry/config into GOMODCACHE on first go env, and
      # setup-go's own restore (which runs after that) then dies with
      # 'tar: File exists' on every job (#794). Per-job (+matrix) keys stop the
      # 'Unable to reserve cache' races between jobs sharing one key.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: go-${{ runner.os }}-${{ github.job }}${{ matrix.distro }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}${{ matrix.distro }}-

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build all targets
        run: |
          VERSION=$(git describe --tags --dirty --always)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              EXT=""
              if [ "$GOOS" = "windows" ] && [ "$GOARCH" = "arm64" ]; then continue; fi
              if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
              echo "Building ${GOOS}/${GOARCH}..."
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "${LDFLAGS}" \
                -o "dist/dhs_${GOOS}_${GOARCH}/dhs${EXT}" ./cmd/dhs
            done
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/

  # ---- Release (push-to-main only, AFTER everything is green) -------------
  # One workflow = one action run per commit, and releasing on red is
  # structurally impossible: release-please bookkeeping (and the version
  # tag it eventually creates when its release PR merges) only runs behind
  # the full test/lint/cross-compile gate. Formerly a separate release.yml
  # sharing the push:main trigger — every merge showed two same-titled runs
  # and the release path never waited for CI (#690).
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: [test, test-rhel, lint, build-all]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: go
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build release binaries
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Restore the Go module/build cache BEFORE Go runs: Go >= 1.23 drops
      # golang.org/x/telemetry/config into GOMODCACHE on first go env, and
      # setup-go's own restore (which runs after that) then dies with
      # 'tar: File exists' on every job (#794). Per-job (+matrix) keys stop the
      # 'Unable to reserve cache' races between jobs sharing one key.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: go-${{ runner.os }}-${{ github.job }}${{ matrix.distro }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}${{ matrix.distro }}-

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Embed the Windows .exe version resource (CompanyName / ProductName /
      # FileVersion / LegalCopyright shown in the Properties dialog) from
      # cmd/dhs/winres/winres.json. go-winres writes a GOOS=windows .syso that
      # `go build` links automatically for windows targets only; other GOOS
      # builds ignore it. Best-effort — a tooling hiccup must never block a
      # release, the .exe just ships without the resource.
      - name: Embed Windows version resource
        run: |
          VERSION=${{ needs.release-please.outputs.tag_name }}
          NUMVER=${VERSION#v}
          go install github.com/tc-hib/go-winres@v0.3.3 || true
          if command -v go-winres >/dev/null 2>&1; then
            go-winres make --in cmd/dhs/winres/winres.json \
              --product-version "${NUMVER}" --file-version "${NUMVER}" \
              --out cmd/dhs/rsrc || echo "go-winres failed — windows .exe will lack the version resource"
          else
            echo "go-winres not installed — windows .exe will lack the version resource"
          fi

      - name: Build all targets
        run: |
          VERSION=${{ needs.release-please.outputs.tag_name }}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              if [ "$GOOS" = "windows" ] && [ "$GOARCH" = "arm64" ]; then continue; fi
              EXT=""; if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
              DIR="dist/dhs_${GOOS}_${GOARCH}"
              mkdir -p "$DIR"
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "${LDFLAGS}" \
                -o "${DIR}/dhs${EXT}" ./cmd/dhs
            done
          done

      # Authenticode-sign the Windows binaries. Gated on the WINDOWS_CERT_PFX_B64
      # secret (base64-encoded .pfx) + WINDOWS_CERT_PASSWORD — skipped cleanly
      # when unset so releases work without a cert, and switch on the moment the
      # secrets are added. Uses osslsigncode (Linux-runnable).
      - name: Sign Windows binaries
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "${PFX_B64}" ]; then
            echo "WINDOWS_CERT_PFX_B64 not set — skipping Authenticode signing"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y osslsigncode
          echo "${PFX_B64}" | base64 -d > /tmp/cert.pfx
          for exe in dist/dhs_windows_*/dhs.exe; do
            osslsigncode sign -pkcs12 /tmp/cert.pfx -pass "${PFX_PASS}" \
              -n "Device Hub Systems" -i https://www.by-systems.be \
              -t http://timestamp.digicert.com -in "$exe" -out "${exe}.signed"
            mv "${exe}.signed" "$exe"
          done
          rm -f /tmp/cert.pfx

      - name: Package archives
        run: |
          cd dist
          for d in dhs_linux_* dhs_darwin_*; do
            tar -czf "${d}.tar.gz" "$d"
          done
          for d in dhs_windows_*; do
            zip -qr "${d}.zip" "$d"
          done

      # Provenance: a SHA-256 manifest of every artifact so downloaders can
      # verify integrity (and a basis for future SLSA attestation).
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
