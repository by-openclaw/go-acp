global:
  scrape_interval: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # One target per alarm watch, written by ansible/playbooks/alarm.yml.
  # Prometheus re-reads the file by itself: adding a device to the
  # inventory and running the play is the whole procedure.
  - job_name: dhs-watch
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/dhs-watch.yml"]
        refresh_interval: 30s

  - job_name: dhs
    static_configs:
      # host.docker.internal works on Docker Desktop (Mac, Windows).
      # On Linux docker, replace with the host's LAN IP or use
      # network_mode: host.
      - targets:
          - "host.docker.internal:9100"   # producer / emulator
          - "host.docker.internal:9101"   # consumer -> REAL Neuron 10.6.255.102
          - "host.docker.internal:9102"   # consumer -> emulated Neuron 127.0.0.1:2072
        labels:
          service: dhs
