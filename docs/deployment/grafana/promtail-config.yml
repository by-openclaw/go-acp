server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Tail dhs stdout log (user redirects dhs ... > /var/log/dhs.log when
  # running outside Docker). Adjust path to match your deployment.
  - job_name: dhs-stdout
    static_configs:
      - targets:
          - localhost
        labels:
          job: dhs
          service: dhs
          __path__: /var/log/dhs*.log
    pipeline_stages:
      # dhs emits slog JSON when started with --log-format json. Each
      # line is {time, level, msg, ...}. Promtail parses and indexes
      # the structured fields.
      - json:
          expressions:
            level: level
            msg: msg
            time: time
            proto: proto
            remote: remote
            cmd: cmd
            # The device is the address the operator typed, and it is
            # the SAME name Prometheus uses (dhs_alarm_*{device=...}),
            # so one dashboard variable drives both stacks.
            device: device
            severity: severity
      - labels:
          level:
          proto:
          device:
          # severity is only set on alarm lines; Loki drops an empty
          # label, so this does not split the stream for other records.
          severity:
      - timestamp:
          source: time
          format: RFC3339Nano

  # Device syslog (#1176, #1181). RFC 5424 on :1514, both transports:
  #   TCP — Arista EOS (`logging format rfc5424`, protocol tcp)
  #   UDP — FusioN / emSFP modules, and dhs itself (`--syslog-addr`)
  # No RFC 3164 listener: no device in the plant sends it. Captured live,
  # the FusioN sends RFC 5424 ("<132>1 2026-…Z emsfp-a2-10-0c - - decap -")
  # which an RFC 3164 parser drops with "expecting a Stamp timestamp".
  # `device` is the sender's address: the same label Prometheus uses
  # (dhs_alarm_*{device=...}), so one dashboard variable drives both.
  - job_name: syslog-rfc5424-tcp
    syslog:
      listen_address: 0.0.0.0:1514
      listen_protocol: tcp
      syslog_format: rfc5424
      idle_timeout: 12h
      label_structured_data: true
      labels:
        job: syslog
        transport: rfc5424-tcp
    relabel_configs: &syslog_labels
      - source_labels: [__syslog_connection_ip_address]
        target_label: device
      - source_labels: [__syslog_message_hostname]
        target_label: host
      - source_labels: [__syslog_message_app_name]
        regex: '(.+?):?'           # EOS sends "ConfigAgent:" — drop the colon
        target_label: app
      # FusioN leaves APP-NAME "-" and puts its event class in MSGID
      # (decap / encap / common): the one field that sorts its events.
      - source_labels: [__syslog_message_msg_id]
        target_label: msg_id
      - source_labels: [__syslog_message_severity]
        target_label: syslog_severity
      - source_labels: [__syslog_message_facility]
        target_label: facility

  - job_name: syslog-rfc5424-udp
    syslog:
      listen_address: 0.0.0.0:1514
      listen_protocol: udp
      syslog_format: rfc5424
      label_structured_data: true
      labels:
        job: syslog
        transport: rfc5424-udp
    relabel_configs: *syslog_labels
