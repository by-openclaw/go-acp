components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
    NmosMetaData:
      type: object
      properties:
        label:
          type: string
        groupHint:
          type: string
    AudioMediaTypeEnum:
      type: string
      enum:
      - s2110-30
      - s2110-31
    ReceiverSkewEnum:
      type: string
      enum:
      - ClassA
      - ClassB
      - ClassC
      - ClassD
    BitDepthEnum:
      type: string
      enum:
      - '16'
      - '24'
      - '32'
    InputSelectionStatusEnum:
      type: string
      enum:
      - Main
      - Backup
    InputSelectionEnum:
      type: string
      enum:
      - Auto
      - Main
      - Backup
    MadiInputChannelModeEnum:
      type: string
      enum:
      - NA
      - '14'
      - '16'
      - '28'
      - '32'
      - '56'
      - '64'
      - Error
    MadiOutputChannelModeEnum:
      type: string
      enum:
      - '56'
      - '64'
    PhaseEnum:
      type: string
      enum:
      - '0'
      - '180'
    PacketTimeEnum:
      type: string
      enum:
      - 83us
      - 125us
      - 250us
      - 333us
      - 1ms
      - 4ms
    NrChannelsEnum:
      type: string
      enum:
      - '1'
      - '2'
      - '4'
      - '8'
      - '16'
      - '32'
      - '64'
    GainPhase:
      type: object
      properties:
        gain:
          type: number
          format: float
          minimum: -60
          maximum: 12
        phase:
          $ref: '#/components/schemas/PhaseEnum'
    AudioChannelBase:
      type: object
      properties:
        name:
          type: string
          readOnly: true
        number:
          type: integer
          format: int32
          readOnly: true
        matrixIndex:
          type: integer
          format: int32
          readOnly: true
    AudioSourceChannel:
      description: A routable audio source channel (matrix flow).
      x-evs-resource-version: 0.1.0
      allOf:
      - $ref: '#/components/schemas/AudioChannelBase'
      - type: object
    AudioDestinationChannel:
      description: A routable audio destination channel (matrix flow) with gain/phase.
      x-evs-resource-version: 0.1.0
      allOf:
      - $ref: '#/components/schemas/AudioChannelBase'
      - type: object
        properties:
          gain:
            type: number
            format: float
            minimum: -60
            maximum: 12
          phase:
            $ref: '#/components/schemas/PhaseEnum'
          inputSelectionStatus:
            $ref: '#/components/schemas/InputSelectionStatusEnum'
    IpSenderLeg:
      type: object
      properties:
        mac:
          type: string
        ip:
          type: string
        port:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
          default: 12700
    WebSocketMessageType:
      type: string
      enum:
      - Event
      - CreateSubscription
      - CreateSubscriptionResponse
      - DeleteSubscription
      - DeleteSubscriptionResponse
    WebSocketMessage:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/WebSocketMessageType'
        id:
          type: integer
          format: int64
        payload: {}
    CreateSubscription:
      type: object
      properties:
        relativeUrl:
          type: string
    CreateSubscriptionResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        subscriptionId:
          type: string
    DeleteSubscription:
      type: object
      properties:
        subscriptionId:
          type: string
    DeleteSubscriptionResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
    Event:
      type: object
      properties:
        documentRoot:
          type: string
        patch: {}
    DDRMemoryBankStatusEnum:
      type: string
      enum:
      - Initialising
      - Ok
      - Calibrating
      - Error
    DDRStatus:
      description: DDR memory bank status
      x-evs-resource-version: 0.1.0
      type: object
      properties:
        memoryBank1:
          $ref: '#/components/schemas/DDRMemoryBankStatusEnum'
        memoryBank2:
          $ref: '#/components/schemas/DDRMemoryBankStatusEnum'
        memoryBank3:
          $ref: '#/components/schemas/DDRMemoryBankStatusEnum'
        memoryBank4:
          $ref: '#/components/schemas/DDRMemoryBankStatusEnum'
    AudioReceiverLeg:
      type: object
      properties:
        mac:
          type: string
    AudioReceiver:
      description: IP audio receiver resource
      x-evs-resource-version: 0.1.0
      type: object
      properties:
        name:
          type: string
        enable:
          type: boolean
        nmos:
          $ref: '#/components/schemas/NmosMetaData'
        sdp:
          type: string
        primaryLeg:
          $ref: '#/components/schemas/AudioReceiverLeg'
        secondaryLeg:
          $ref: '#/components/schemas/AudioReceiverLeg'
        skew:
          $ref: '#/components/schemas/ReceiverSkewEnum'
        streamDelayMs:
          type: number
          format: float
          minimum: 0
          maximum: 5000
    AudioReceiverLegStatus:
      type: object
      properties:
        receiving:
          type: boolean
    AudioReceiverStatus:
      type: object
      properties:
        mediaType:
          $ref: '#/components/schemas/AudioMediaTypeEnum'
        info:
          type: string
        primaryLeg:
          $ref: '#/components/schemas/AudioReceiverLegStatus'
        secondaryLeg:
          $ref: '#/components/schemas/AudioReceiverLegStatus'
        numChannels:
          type: integer
          format: int32
          minimum: 0
          maximum: 64
        streamDelayMs:
          type: number
          format: float
          minimum: 0
          maximum: 5000
    AudioReceiverLegMetrics:
      type: object
      properties:
        inputDelay:
          type: number
          format: float
        dataRateKbps:
          type: number
          format: float
        rtpSequenceErrorCount:
          type: integer
          format: int32
        thresholdAlarm:
          type: boolean
        packetIntervalMin:
          type: integer
          format: int32
        packetIntervalMax:
          type: integer
          format: int32
        packetIntervalAvg:
          type: integer
          format: int32
        averageSkew:
          type: integer
          format: int32
        rtpSsrc:
          type: integer
          format: int64
    AudioReceiverMetrics:
      type: object
      properties:
        primaryLeg:
          $ref: '#/components/schemas/AudioReceiverLegMetrics'
        secondaryLeg:
          $ref: '#/components/schemas/AudioReceiverLegMetrics'
    AudioReceiverResetMetrics:
      type: object
      properties:
        rtpSequenceErrors:
          type: boolean
    AudioSender:
      description: IP audio sender
      x-evs-resource-version: 0.1.0
      type: object
      properties:
        name:
          type: string
        enable:
          type: boolean
        nmos:
          $ref: '#/components/schemas/NmosMetaData'
        mediaType:
          $ref: '#/components/schemas/AudioMediaTypeEnum'
        primaryLeg:
          $ref: '#/components/schemas/IpSenderLeg'
        secondaryLeg:
          $ref: '#/components/schemas/IpSenderLeg'
        nrChannels:
          $ref: '#/components/schemas/NrChannelsEnum'
        bitDepth:
          $ref: '#/components/schemas/BitDepthEnum'
        packetTime:
          $ref: '#/components/schemas/PacketTimeEnum'
        inputSelection:
          $ref: '#/components/schemas/InputSelectionEnum'
    AudioSenderLegStatus:
      type: object
      properties:
        active:
          type: boolean
    AudioSenderStatus:
      type: object
      properties:
        info:
          type: string
        sdp:
          type: string
        primaryLeg:
          $ref: '#/components/schemas/AudioSenderLegStatus'
        secondaryLeg:
          $ref: '#/components/schemas/AudioSenderLegStatus'
    RtpPayloadTypeNumbers:
      description: RTP payload type numbers
      x-evs-resource-version: 0.1.0
      type: object
      properties:
        s2110_30:
          type: integer
          format: int32
          minimum: 0
          maximum: 127
        s2110_31:
          type: integer
          format: int32
          minimum: 0
          maximum: 127
    MadiStatusEnum:
      type: string
      enum:
      - NA
      - Present
      - Error
    MadiFrameTypeEnum:
      type: string
      enum:
      - NA
      - <32k
      - 32k
