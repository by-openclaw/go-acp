components:
  schemas:
    App:
      type: 'object'
      properties:
        buildType:
          type: 'string'
        compiledAt:
          type: 'string'
        dirty:
          type: 'boolean'
        gitCommit:
          type: 'string'
        modelVersion:
          type: 'integer'
          format: 'int32'
        productName:
          type: 'string'
        productVersion:
          type: 'string'
      required:
        - 'buildType'
        - 'compiledAt'
        - 'dirty'
        - 'gitCommit'
        - 'modelVersion'
        - 'productName'
        - 'productVersion'
    Capabilities:
      type: 'object'
      properties:
        coProcessor:
          type: 'string'
          enum:
            - 'present'
            - 'error'
            - 'NA'
          description: 'Smarc board. (Dolby processing, etc..)'
      required:
        - 'coProcessor'
    SelfGet:
      type: 'object'
      properties:
        app:
          $ref: '#/components/schemas/App'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      required:
        - 'app'
        - 'capabilities'
    NmosMetaData:
      type: 'object'
      properties:
        label:
          type: 'string'
        groupHint:
          type: 'string'
      required:
        - 'label'
        - 'groupHint'
    ReceiverSkewEnum:
      type: 'string'
      enum:
        - 'ClassD'
        - 'ClassA'
        - 'ClassB'
        - 'ClassC'
    IpReceiverVideo:
      type: 'object'
      properties:
        uuid:
          type: 'string'
          format: 'uuid'
          description: 'Unique identifier for this stream, including NMOS api.'
        name:
          type: 'string'
          description: 'Internal name of stream, similar to ACP2 node name'
        enable:
          type: 'boolean'
        nmos:
          $ref: '#/components/schemas/NmosMetaData'
        sdp:
          type: 'string'
        skew:
          $ref: '#/components/schemas/ReceiverSkewEnum'
      required:
        - 'uuid'
        - 'name'
        - 'enable'
        - 'nmos'
        - 'sdp'
        - 'skew'
    GenericApiMessage:
      type: 'object'
      properties:
        code:
          type: 'integer'
          format: 'int32'
        message:
          type: 'string'
      required:
        - 'code'
        - 'message'
    IpReceiverVideoPut:
      type: 'object'
      properties:
        enable:
          type: 'boolean'
        nmos:
          $ref: '#/components/schemas/NmosMetaData'
        sdp:
          type: 'string'
        skew:
          $ref: '#/components/schemas/ReceiverSkewEnum'
      required:
        - 'enable'
        - 'nmos'
        - 'sdp'
        - 'skew'
    DigitalVideoStandardEnum:
      type: 'string'
      enum:
        - '2160p50'
        - '2160p59.94'
        - '2160p60'
        - '2160i50'
        - '2160i60'
        - '1080p50'
        - '1080p59.94'
        - '1080p60'
        - '1080i50'
        - '1080i59.94'
        - '1080i60'
        - '1080p25'
        - '1080p30'
        - '1080p24'
        - '720p50'
        - '720p59.94'
        - '720p60'
        - '720p25'
        - '720p30'
        - '720p24'
        - 'SD625'
        - 'SD525'
        - '1080psf23.98'
        - '1080psf24'
        - '1080psf25'
        - '1080psf29.97'
        - '1080psf30'
        - 'NA'
        - 'Auto'
        - 'Off'
        - '2160i59.94'
        - '1080p29.97'
        - '720p29.97'
        - '1080p23.98'
        - '720p23.98'
        - '2160p30'
        - '2160p29.97'
        - '2160p25'
        - '2160p24'
        - '2160p23.98'
    MediaTypeEnum:
      type: 'string'
      enum:
        - 's2022-6'
        - 's2110-20'
        - 's2110-22'
        - 's2110-30'
        - 's2110-31'
        - 's2110-40'
    IpReceiverStatusLegStatistics:
      type: 'object'
      properties:
        dataRateKbps:
          type: 'integer'
          format: 'int32'
        rtpSequenceErrorCount:
          type: 'integer'
          format: 'int32'
        thresholdAlarm:
          type: 'boolean'
        packetIntervalMin:
          type: 'integer'
          format: 'int32'
        packetIntervalMax:
          type: 'integer'
          format: 'int32'
        packetIntervalAvg:
          type: 'integer'
          format: 'int32'
        averageSkew:
          type: 'integer'
          format: 'int32'
        rtpSsrc:
          type: 'integer'
          format: 'int32'
      required:
        - 'dataRateKbps'
        - 'rtpSequenceErrorCount'
        - 'thresholdAlarm'
        - 'packetIntervalMin'
        - 'packetIntervalMax'
        - 'packetIntervalAvg'
        - 'averageSkew'
        - 'rtpSsrc'
    IpReceiverStatusLeg:
      type: 'object'
