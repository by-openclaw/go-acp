# AMWA NMOS Testing harness — both dhs and the AMWA tool on the SAME
# Linux bridge so mDNS multicast actually flows between them. This is
# the ONE setup where we expect IS-04-01 mDNS-discovery tests
# (test_01, test_04..test_11, test_15, test_16, test_21) to pass.
#
# `docker compose up -d` builds dhs locally from ../../bin/dhs.linux,
# brings up the AMWA tool, then both join the same bridge. Web UI lands
# on the host at http://127.0.0.1:5000.

services:
  nmos-testing:
    image: amwa/nmos-testing:latest
    container_name: nmos-testing
    networks:
      nmos: {}
    ports:
      - "5000:5000"          # web UI / API
      - "5101-5106:5101-5106"  # mock registries (also reachable by hostname)
    restart: unless-stopped

  dhs:
    build:
      context: .
      dockerfile: Dockerfile.dhs
    container_name: dhs-node
    hostname: dhs-node
    networks:
      nmos:
        aliases:
          - dhs-node.local
    ports:
      - "18080:18080"
    command:
      - producer
      - nmos
      - serve
      - --config=/app/amwa-test-node.json
      - --bind=:18080
      - --advertise-host=dhs-node:18080
      - --mdns
      - --api-ver=${DHS_API_VER:-v1.3}
    depends_on:
      - nmos-testing
    restart: unless-stopped

  # IS-04-02 Registry under test. Reuses the same image; the entrypoint
  # exec's dhs with whatever CLI args we pass, so we drive `registry
  # nmos serve` here. Without --api-ver the registry mounts every
  # is04 codec it has compiled in (v1.0/v1.1/v1.2/v1.3) at parallel
  # /x-nmos/{registration,query}/<v>/ trees so the AMWA Testing tool
  # can target any minor in one run.
  dhs-registry:
    build:
      context: .
      dockerfile: Dockerfile.dhs
    container_name: dhs-registry
    hostname: dhs-registry
    networks:
      nmos:
        aliases:
          - dhs-registry.local
    ports:
      - "8235:8235"
    command:
      - registry
      - nmos
      - serve
      - --bind=:8235
      - --advertise-host=dhs-registry:8235
      - --mdns
    depends_on:
      - nmos-testing
    restart: unless-stopped

networks:
  nmos:
    driver: bridge
    enable_ipv6: false
