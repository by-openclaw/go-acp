---
# Repeat one Go test on the Go build host until it fails — the flake hunter.
#
# A test that failed once on the desk is reproduced here, on the fleet, never
# with a shell loop on a workstation. The play clones the given ref from a git
# bundle into a fresh directory on the build host, then runs the test
# `go_test_count` times with GOMAXPROCS capped, while `go_test_load` copies of
# `go vet ./...` keep every core busy (the "slow machine" case). The full test
# output is kept on the build host and fetched to the controller, so the first
# difference of a failure is never lost to a truncated capture.
#
# Read-only for the fleet: the clone lives under go_test_root and is replaced
# on every run; nothing is installed. changed_when: false throughout.
#
#   # on the control node, from a bundle made on the desk:
#   ansible-playbook playbooks/go-test-repeat.yml \
#     -e go_test_bundle=/tmp/branch.bundle -e go_test_ref=fix/cli-golden-flake \
#     -e go_test_pkg=./cmd/dhs -e go_test_run=TestCLISurfaceGolden \
#     -e go_test_count=20 -e go_test_procs=1 -e go_test_load=4
- name: repeat one Go test under load on the Go build host
  hosts: dhs-tools
  gather_facts: false
  vars:
    go_test_bundle: ""            # path on the control node
    go_test_ref: main
    go_test_pkg: ./...
    go_test_run: ""
    go_test_count: 10
    go_test_procs: 1              # GOMAXPROCS for the test binary
    go_test_load: 0               # parallel `go vet ./...` loops while it runs
    go_test_timeout: 3h           # go test -timeout covers the whole repeat, not one run
    go_test_root: /root/go-test-repeat
    go_test_out: /tmp/go-test-repeat
    go_env:
      PATH: "/usr/local/go/bin:/usr/bin:/bin"
      HOME: /root
  tasks:
    - name: a bundle and a test name are required
      ansible.builtin.assert:
        that:
          - go_test_bundle | length > 0
          - go_test_run | length > 0
        fail_msg: "pass -e go_test_bundle=<path on the control node> -e go_test_run=<TestName>"

    - name: copy the bundle to the build host
      ansible.builtin.copy:
        src: "{{ go_test_bundle }}"
        dest: "{{ go_test_root }}.bundle"
        mode: "0600"
      changed_when: false

    - name: fresh clone of the ref
      ansible.builtin.shell: |
        set -e
        rm -rf {{ go_test_root }}
        git init -q {{ go_test_root }}
        cd {{ go_test_root }}
        git fetch -q {{ go_test_root }}.bundle {{ go_test_ref }}
        GIT_LFS_SKIP_SMUDGE=1 git checkout -q --detach FETCH_HEAD
        git log --oneline -1
      args:
        executable: /bin/bash
      register: clone
      changed_when: false

    - name: ref under test
      ansible.builtin.debug:
        msg: "{{ clone.stdout }}"

    - name: run the test under load
      ansible.builtin.shell: |
        set -o pipefail
        cd {{ go_test_root }}
        pids=()
        for i in $(seq 1 {{ go_test_load }}); do
          ( while true; do go vet ./... >/dev/null 2>&1; done ) &
          pids+=($!)
        done
        GOMAXPROCS={{ go_test_procs }} go test -timeout {{ go_test_timeout }} -count={{ go_test_count }} \
          -run '^{{ go_test_run }}$' {{ go_test_pkg }} -v > {{ go_test_out }}.log 2>&1
        rc=$?
        for p in "${pids[@]}"; do pkill -P "$p" 2>/dev/null; kill "$p" 2>/dev/null; done
        wait 2>/dev/null
        echo "rc=$rc pass=$(grep -c -- '^--- PASS' {{ go_test_out }}.log) fail=$(grep -c -- '^--- FAIL' {{ go_test_out }}.log)"
        exit $rc
      args:
        executable: /bin/bash
      environment: "{{ go_env }}"
      register: run
      changed_when: false
      failed_when: false

    - name: fetch the full log to the control node
      ansible.builtin.fetch:
        src: "{{ go_test_out }}.log"
        dest: "{{ go_test_out }}-{{ go_test_run }}.log"
        flat: true
      changed_when: false

    - name: result
      ansible.builtin.debug:
        msg:
          - "{{ run.stdout_lines | last }}"
          - "full log on the control node: {{ go_test_out }}-{{ go_test_run }}.log"

    - name: the test must pass every run
      ansible.builtin.assert:
        that: run.rc == 0
        fail_msg: "{{ go_test_run }} failed — see {{ go_test_out }}-{{ go_test_run }}.log"
