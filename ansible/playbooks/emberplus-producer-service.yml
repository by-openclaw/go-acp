---
# Ember+ provider as a long-running service — the device a real controller
# (the staging Cerebrum, #714 part A) is pointed at. Twin of
# acp2-producer.yml.
#
# Its own host, dhs-ubuntu (10.6.250.102) by default: Cerebrum registers a
# device per IP, and dhs-debian's IP is already the acp2 Neuron emulator.
# Override with -e ep_hosts=<inventory host>.
#
# NOT emberplus-producers.yml: that play is a test-time rotation — it stops
# and disables every other dhs service (dhs-acp2 included) before starting
# its own provider, which would take the acp2 emulator away from Cerebrum.
# This play touches dhs-emberplus.service only.
#
# Serves the committed integration fixture (ADR-0022 manifest + DMs):
# identity, oneToN / oneToOne / nToN / dynamic matrices, functions.
#
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/emberplus-producer-service.yml
#
# Idempotent: run-twice = 0 changes.

- name: Ember+ — provider service for controllers (#714)
  hosts: "{{ ep_hosts | default('dhs-ubuntu') }}"
  gather_facts: false
  vars:
    ep_root: /etc/dhs/emberplus
    ep_port: 9000
    ep_metrics: ":9103"
    ep_fixtures: "{{ playbook_dir }}/../../internal/emberplus/testdata/integration-test"
    ep_manifest: emberplus-integration.json
  tasks:
    - name: Fixture directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ep_root }}"
        - "{{ ep_root }}/cache/dm/emberplus"

    - name: Committed DM store (ADR-0022 identity-keyed)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ ep_root }}/cache/dm/emberplus/{{ item | basename }}"
        mode: "0644"
      with_fileglob:
        - "{{ ep_fixtures }}/dm/emberplus/*.json"
      notify: restart dhs-emberplus

    - name: Manifest
      ansible.builtin.copy:
        src: "{{ ep_fixtures }}/manifest/{{ ep_manifest }}"
        dest: "{{ ep_root }}/manifest.json"
        mode: "0644"
      notify: restart dhs-emberplus

    - name: dhs-emberplus.service
      ansible.builtin.copy:
        content: |
          # Managed by ansible/playbooks/emberplus-producer-service.yml (#714).
          [Unit]
          Description=dhs Ember+ provider (integration fixture, for controllers)
          After=network.target
          [Service]
          ExecStart=/usr/local/bin/dhs producer emberplus serve \
            --manifest {{ ep_root }}/manifest.json \
            --cache-dir {{ ep_root }}/cache \
            --port {{ ep_port }} --host 0.0.0.0 \
            --metrics-addr {{ ep_metrics }} \
            --log-level info
          Restart=always
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/dhs-emberplus.service
        mode: "0644"
      notify: restart dhs-emberplus

    - name: Service enabled + running
      ansible.builtin.systemd:
        name: dhs-emberplus
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers (restart before verifying)
      ansible.builtin.meta: flush_handlers

    - name: Provider accepts connections
      ansible.builtin.wait_for:
        port: "{{ ep_port }}"
        timeout: 30

    - name: Provider answers a walk
      ansible.builtin.command: >-
        /usr/local/bin/dhs consumer emberplus walk 127.0.0.1 --port {{ ep_port }}
      register: ep_walk
      changed_when: false
      failed_when: ep_walk.rc != 0 or 'objects' not in ep_walk.stdout

  handlers:
    - name: restart dhs-emberplus
      ansible.builtin.systemd:
        name: dhs-emberplus
        state: restarted
        daemon_reload: true
