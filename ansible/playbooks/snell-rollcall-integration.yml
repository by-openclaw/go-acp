---
# Snell RollCall integration CONTRACT TEST, per ADR-0025 deliverable 3:
# Ansible is the exclusive integration / verify / deploy driver — no shell
# scripts in another language. This play drives the REAL dhs CLI verbs against
# real servers, not `go test`.
#
# Three tiers, in the order ADR-0025 puts them:
#
#   1. VENDOR EMULATOR (gated on ROLLCALL_SIM_HOST): the Snell Centra
#      controller from internal/snell-rollcall/assets/Emulator/RouterSimulator.
#      It is the oracle that matters — it is the vendor's own code, it speaks
#      both generations, and it serves a routing interface. Read-only verbs
#      plus, when ROLLCALL_SIM_ROUTE is set, one crosspoint set on a
#      destination the operator nominates.
#
#   2. LIVE DEVICE (gated on ROLLCALL_TEST_HOST): a real frame, Centra or
#      Sirius on the lab network. READ-ONLY: info, walk, get, router, tally.
#      Never a write to a real device from a test.
#
#   3. LOOPBACK (always): our own provider serving a committed tree, driven by
#      our own consumer. It runs last because two halves of one codebase
#      agreeing proves the least; it is a regression net, not an oracle. The
#      producer is ephemeral and torn down in `always`, so the net effect is
#      zero persistent change and run-twice is the same result.
#
# dhs logs go to stderr, so every task registers and surfaces both streams
# under `ansible-playbook -v`.
#
#   # loopback only:
#   ansible-playbook -i inventory/hosts.ini playbooks/snell-rollcall-integration.yml
#
#   # plus the vendor emulator (start CentraController.exe first; it listens
#   # on 2057 by default — see internal/snell-rollcall/docs/oracle-centra.md):
#   ROLLCALL_SIM_HOST=127.0.0.1 ROLLCALL_SIM_PORT=2057 \
#     ansible-playbook -i inventory/hosts.ini playbooks/snell-rollcall-integration.yml
#
#   # plus a live device, read-only:
#   ROLLCALL_TEST_HOST=10.6.250.105 \
#     ansible-playbook -i inventory/hosts.ini playbooks/snell-rollcall-integration.yml
#
# Every verb opens its own connection and a RollCall gateway wedges under that
# churn, so the play settles between connections to a device it did not start.
# ROLLCALL_SETTLE_SECONDS tunes it; 0 disables it.

- name: Snell RollCall integration (emulator + live device + loopback)
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    repo_root: "{{ playbook_dir }}/../.."
    dhs_bin: "{{ repo_root }}/bin/dhs{{ '.exe' if ansible_os_family == 'Windows' else '' }}"
    tree_fixture: "{{ repo_root }}/internal/snell-rollcall/testdata/exports/frame_tree.json"
    producer_log: "/tmp/dhs-rollcall-producer.log"

    # The loopback producer. A high port so a developer's own device on 2050
    # is never in the way.
    loopback_port: 22050
    loopback_host: "127.0.0.1"

    # Where the node table of each path is kept, so two paths can be diffed.
    artifact_dir: "{{ lookup('env', 'ROLLCALL_ARTIFACTS') | default('/tmp/dhs-rollcall', true) }}"

    # A prebuilt binary, for a control node with Ansible and no Go toolchain —
    # which is what the designated control node is. Empty means build one.
    dhs_bin_given: "{{ lookup('env', 'DHS_BIN') | default('', true) }}"

    # Each endpoint gets its own budget because a proxy adds a hop and the
    # 16-bit generation asks for one item at a time.
    endpoint_timeout: "{{ lookup('env', 'ROLLCALL_ENDPOINT_TIMEOUT') | default('30s', true) }}"

    # Tier 1: the vendor emulator, reached directly.
    sim_host: "{{ lookup('env', 'ROLLCALL_SIM_HOST') | default('', true) }}"
    sim_port: "{{ lookup('env', 'ROLLCALL_SIM_PORT') | default('2057', true) }}"

    # The same plant reached through the vendor RollCall IP Proxy. A proxy
    # publishes each downstream chassis as a bridge node under a substitution
    # address, so what comes back is a different set of nodes describing the
    # same equipment — which is exactly what makes the comparison worth making.
    proxy_host: "{{ lookup('env', 'ROLLCALL_PROXY_HOST') | default('', true) }}"
    proxy_port: "{{ lookup('env', 'ROLLCALL_PROXY_PORT') | default('2050', true) }}"

    # The same plant reached through our own bridge. Gated and skipped until
    # there is one; a path that does not exist is not faked.
    bridge_host: "{{ lookup('env', 'ROLLCALL_BRIDGE_HOST') | default('', true) }}"
    bridge_port: "{{ lookup('env', 'ROLLCALL_BRIDGE_PORT') | default('22051', true) }}"
    # A destination to route on the emulator, as matrix:level:dest:source.
    # Unset means read-only even there.
    sim_route: "{{ lookup('env', 'ROLLCALL_SIM_ROUTE') | default('', true) }}"

    # Every verb opens its own connection, and a RollCall gateway does not
    # enjoy that. Measured on the vendor Centra emulator: roughly the third
    # connection in quick succession is accepted at TCP and then never
    # answered, repeatable, and cleared only by restarting the controller. A
    # real unit is no better placed — the vendor's own note is that units
    # "don't time them out very well (at all), and then run out of available
    # sessions".
    #
    # So the play settles between connections to a device it did not start.
    # Set ROLLCALL_SETTLE_SECONDS=0 to drive a gateway that does not need it.
    settle_seconds: "{{ lookup('env', 'ROLLCALL_SETTLE_SECONDS') | default('5', true) }}"

    # Every path to the plant, in the order they prove things. A path with no
    # host configured is dropped rather than faked.
    rollcall_candidates:
      - name: direct
        host: "{{ sim_host }}"
        port: "{{ sim_port }}"
        router: true
        why: "the connector's own session layer against the vendor's own code"
      - name: vendor-proxy
        host: "{{ proxy_host }}"
        port: "{{ proxy_port }}"
        router: false
        why: "that we behave like a RollCall Control Panel on the aggregation path a real plant uses"
      - name: dhs-bridge
        host: "{{ bridge_host }}"
        port: "{{ bridge_port }}"
        router: false
        why: "that our own aggregation is indistinguishable from the vendor's"
      - name: live
        host: "{{ live_host }}"
        port: "{{ live_port }}"
        router: false
        why: "that real hardware answers what the emulator taught us to expect"

    # Tier 2: a live device, read-only.
    live_host: "{{ lookup('env', 'ROLLCALL_TEST_HOST') | default('', true) }}"
    live_port: "{{ lookup('env', 'ROLLCALL_TEST_PORT') | default('2050', true) }}"
    live_slot: "{{ lookup('env', 'ROLLCALL_TEST_SLOT') | default('0', true) }}"

  tasks:
    - name: Keep the node tables somewhere
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"

    - name: Build the dhs binary under test
      ansible.builtin.command:
        cmd: go build -o "{{ dhs_bin }}" ./cmd/dhs
        chdir: "{{ repo_root }}"
      changed_when: false
      when: dhs_bin_given | length == 0

    - name: Use the binary that was handed to us
      ansible.builtin.set_fact:
        dhs_bin: "{{ dhs_bin_given }}"
      when: dhs_bin_given | length > 0

    - name: The binary under test runs here
      ansible.builtin.command:
        cmd: "{{ dhs_bin }} version"
      register: dhs_version
      changed_when: false
      failed_when: dhs_version.rc != 0

    # ------------------------------------------------------------------
    # One contract, every path to the plant.
    #
    # A frame answers with its cards, a controller with the units it fronts, a
    # proxy with the bridges it aggregates. Different devices, same shape — so
    # the same assertions run over each, and each node table is kept for the
    # comparison at the end.
    # ------------------------------------------------------------------

    - name: Work out which paths to the plant are configured
      ansible.builtin.set_fact:
        rollcall_paths: "{{ rollcall_candidates | rejectattr('host', 'equalto', '') | list }}"

    - name: Say which paths are being tested
      ansible.builtin.debug:
        msg: >-
          {{ rollcall_paths | length }} path(s):
          {{ rollcall_paths | map(attribute='name') | list | join(', ') }}
          {{ '(set ROLLCALL_SIM_HOST / ROLLCALL_PROXY_HOST / ROLLCALL_BRIDGE_HOST / ROLLCALL_TEST_HOST to add more)'
             if rollcall_paths | length < 4 else '' }}

    - name: The same contract over every configured path
      ansible.builtin.include_tasks: tasks/snell-rollcall-contract.yml
      loop: "{{ rollcall_paths }}"
      loop_control:
        loop_var: endpoint
        label: "{{ endpoint.name }} -> {{ endpoint.host }}:{{ endpoint.port }}"

    # -------------------------------------------------------------------
    # Tier 1 — the vendor emulator. The oracle that counts.
    # -------------------------------------------------------------------

    - name: Tier 1 — the vendor emulator
      when: sim_host | length > 0
      block:
        # Enumeration is the shared contract's job and has already run over
        # this path. What is left is what only this path can prove: a
        # routing interface, and a crosspoint on it.
        - name: Settle before the next connection — finding the routing interface
          ansible.builtin.pause:
            seconds: "{{ settle_seconds | int }}"
          when: settle_seconds | int > 0

        - name: Find the routing interface
          ansible.builtin.command:
            cmd: "{{ dhs_bin }} consumer rollcall router {{ sim_host }}:{{ sim_port }}"
          register: sim_router
          changed_when: false

        - name: The routing interface published matrices and levels
          ansible.builtin.assert:
            that:
              - "'interface' in sim_router.stdout"
              - "'MATRIX' in sim_router.stdout"
              - sim_router.stdout is search('LEVEL')
            fail_msg: >-
              No routing interface. It lives on the panel node, not on the
              matrices, and it answers command 100 with a version number — see
              internal/snell-rollcall/docs/oracle-centra.md §2.

        - name: Settle before the next connection — reading a crosspoint
          ansible.builtin.pause:
            seconds: "{{ settle_seconds | int }}"
          when: settle_seconds | int > 0

        - name: Read a crosspoint
          ansible.builtin.command:
            cmd: >-
              {{ dhs_bin }} consumer rollcall route {{ sim_host }}:{{ sim_port }}
              --matrix 1 --level 1 --dest 1 --output json
          register: sim_xpt
          changed_when: false

        - name: The crosspoint names a matrix, a level and a source
          ansible.builtin.assert:
            that:
              - (sim_xpt.stdout | from_json).destination == 1
              - (sim_xpt.stdout | from_json).source.matrix is defined
              - (sim_xpt.stdout | from_json).source.level is defined

        - name: Make a route, when the operator nominated one
          when: sim_route | length > 0
          block:
            - name: Settle before the take
              ansible.builtin.pause:
                seconds: "{{ settle_seconds | int }}"
              when: settle_seconds | int > 0

            - name: Route {{ sim_route }}
              ansible.builtin.command:
                cmd: >-
                  {{ dhs_bin }} consumer rollcall route {{ sim_host }}:{{ sim_port }}
                  --matrix {{ sim_route.split(':')[0] }}
                  --level {{ sim_route.split(':')[1] }}
                  --dest {{ sim_route.split(':')[2] }}
                  --source {{ sim_route.split(':')[3] }}
                  --output json
              register: sim_take
              # A route is a change to a device, and saying otherwise would be
              # a lie to anyone reading the run.
              changed_when: true

            - name: The router reported what it actually routed
              ansible.builtin.assert:
                that:
                  - (sim_take.stdout | from_json).routed
                fail_msg: >-
                  Nothing is routed to that destination after the take. Note the
                  reported source may differ from the one asked for: where a
                  route crosses a tieline the controller reports the far end.

        - name: Emulator output
          ansible.builtin.debug:
            msg: "{{ sim_router.stdout_lines }}"
            verbosity: 1

    # -------------------------------------------------------------------
    # Tier 2 — a live device. Read-only, always.
    # -------------------------------------------------------------------

    - name: Tier 2 — a live device, read-only
      when: live_host | length > 0
      block:
        # The contract has already enumerated this device. A walk is what
        # only a real device can prove: that a card's menu decodes.
        - name: Settle before the next connection — walking a slot
          ansible.builtin.pause:
            seconds: "{{ settle_seconds | int }}"
          when: settle_seconds | int > 0

        - name: Walk one slot
          ansible.builtin.command:
            cmd: "{{ dhs_bin }} consumer rollcall walk {{ live_host }}:{{ live_port }} --slot {{ live_slot }}"
          register: live_walk
          changed_when: false
          failed_when: false

        - name: A walk either finds objects or says why
          ansible.builtin.assert:
            that:
              - live_walk.rc == 0 or live_walk.stderr | length > 0
            fail_msg: "The walk produced neither objects nor an explanation."

        - name: Settle before the next connection — probing for a routing interface
          ansible.builtin.pause:
            seconds: "{{ settle_seconds | int }}"
          when: settle_seconds | int > 0

        - name: Look for a routing interface
          ansible.builtin.command:
            cmd: "{{ dhs_bin }} consumer rollcall router {{ live_host }}:{{ live_port }}"
          register: live_router
          changed_when: false
          # A frame of cards has no routing interface, and that is an answer.
          failed_when: false

        - name: Live device output
          ansible.builtin.debug:
            msg:
              - "{{ live_walk.stdout_lines | default([]) }}"
              - "{{ live_router.stdout_lines | default([]) }}"
            verbosity: 1

    # -------------------------------------------------------------------
    # Tier 3 — loopback. A regression net, not an oracle.
    # -------------------------------------------------------------------

    - name: Note whether the committed tree is here to serve
      ansible.builtin.set_fact:
        have_fixture: "{{ tree_fixture is exists }}"

    - name: Tier 3 - loopback
      when: have_fixture
      block:
        - name: Serve the committed frame tree
          ansible.builtin.shell:
            cmd: >-
              nohup "{{ dhs_bin }}" producer rollcall serve
              --tree "{{ tree_fixture }}"
              --host {{ loopback_host }} --port {{ loopback_port }}
              > /tmp/dhs-rollcall-producer.log 2>&1 &
              echo $!
            executable: /bin/bash
          register: producer
          changed_when: false

        - name: Wait for the producer to accept a connection
          ansible.builtin.wait_for:
            host: "{{ loopback_host }}"
            port: "{{ loopback_port }}"
            timeout: 20

        # Our own producer is held to the contract every other path is held
        # to. It is the weakest oracle in the play - two halves of one codebase
        # agreeing - but it is the only one that must never regress.
        - name: The same contract, against our own producer
          ansible.builtin.include_tasks: tasks/snell-rollcall-contract.yml
          loop:
            - name: loopback
              host: "{{ loopback_host }}"
              port: "{{ loopback_port }}"
              router: false
              why: "that our provider serves what our consumer reads"
          loop_control:
            loop_var: endpoint
            label: "{{ endpoint.name }}"

        - name: The frame is the gateway and the two cards the fixture describes
          ansible.builtin.assert:
            that:
              - contract_nodes.slots | int == 3
            fail_msg: >-
              The served frame does not match the committed tree. It is three
              nodes rather than two: a port list names the gateway before its
              cards, which is what both devices we can measure do.

        - name: Walk the first card
          ansible.builtin.command:
            cmd: "{{ dhs_bin }} consumer rollcall walk {{ loopback_host }}:{{ loopback_port }} --slot 0"
          register: loop_walk
          changed_when: false

        - name: The walk found the tree's own objects
          ansible.builtin.assert:
            that:
              - "'gain' in loop_walk.stdout"
              - "'enable' in loop_walk.stdout"
              - "'product' in loop_walk.stdout"

        - name: Read a value
          ansible.builtin.command:
            cmd: >-
              {{ dhs_bin }} consumer rollcall get {{ loopback_host }}:{{ loopback_port }}
              --slot 0 --label gain
          register: loop_get
          changed_when: false

        - name: The value carries the unit the tree declared
          ansible.builtin.assert:
            that:
              - "'dB' in loop_get.stdout"
            fail_msg: >-
              A real is carried as an integer scaled by its factor, and the
              format string is the only place the unit can travel.

        - name: Write a value
          ansible.builtin.command:
            cmd: >-
              {{ dhs_bin }} consumer rollcall set {{ loopback_host }}:{{ loopback_port }}
              --slot 0 --label gain --value -6
          register: loop_set
          # The producer is ephemeral and torn down below, so this run leaves
          # nothing behind: run-twice is the same result (ADR-0025).
          changed_when: false

        - name: The device confirmed what it stored
          ansible.builtin.assert:
            that:
              - "'-6' in loop_set.stdout"
            fail_msg: >-
              A write is answered with the stored value rather than an
              acknowledgement, so a caller learns about clamping without a
              second read.

        - name: Write past the end of the range
          ansible.builtin.command:
            cmd: >-
              {{ dhs_bin }} consumer rollcall set {{ loopback_host }}:{{ loopback_port }}
              --slot 0 --label gain --value 9999
          register: loop_clamp
          changed_when: false

        - name: The device clamped it and said so
          ansible.builtin.assert:
            that:
              - "'9999' not in loop_clamp.stdout"
            fail_msg: "A value outside the range came back unchanged."

        - name: Refuse a write to a read-only object
          ansible.builtin.command:
            cmd: >-
              {{ dhs_bin }} consumer rollcall set {{ loopback_host }}:{{ loopback_port }}
              --slot 0 --label status --value 1
          register: loop_readonly
          changed_when: false
          failed_when: false

        - name: A read-only object refuses rather than pretending
          ansible.builtin.assert:
            that:
              - loop_readonly.rc != 0
            fail_msg: >-
              Writing to a read-only line succeeded. Access is carried in the
              menu line's style, and a device that ignores it is worse than one
              that refuses.

        - name: Loopback output
          ansible.builtin.debug:
            msg:
              - "{{ loop_get.stdout_lines }}"
              - "{{ loop_set.stdout_lines }}"
            verbosity: 1

      always:
        - name: Stop the loopback producer
          ansible.builtin.shell: "pkill -f '[d]hs producer rollcall serve --tree {{ tree_fixture }}' || true"
          changed_when: false

        - name: The producer's own log, when something went wrong
          ansible.builtin.command: "cat {{ producer_log }}"
          register: producer_out
          changed_when: false
          failed_when: false

        - name: Producer log
          ansible.builtin.debug:
            var: producer_out.stdout_lines
            verbosity: 1

    # ------------------------------------------------------------------
    # The comparison. This is what the whole shape is for: the same plant,
    # read every way it can be reached, side by side.
    #
    # It reports rather than asserts, deliberately. A proxy publishes each
    # downstream chassis as one bridge node, so reading fifteen units directly
    # and two bridges through a proxy is correct on both paths and not a
    # disagreement. Asserting they match would be asserting a bug. What the
    # report is for is the difference nobody predicted.
    # ------------------------------------------------------------------

    - name: Collect every node table that was written
      ansible.builtin.find:
        paths: "{{ artifact_dir }}"
        patterns: "nodes-*.json"
      register: node_tables

    - name: Read them back
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ node_tables.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: node_blobs

    - name: Build the comparison
      ansible.builtin.set_fact:
        rollcall_comparison: >-
          {{ node_blobs.results | map(attribute='content') | map('b64decode')
             | map('from_json') | list }}
        rollcall_names: >-
          {{ node_blobs.results | map(attribute='item') | map(attribute='path')
             | map('basename') | map('replace', 'nodes-', '')
             | map('replace', '.json', '') | list }}

    - name: The same plant, every way it can be reached
      ansible.builtin.debug:
        msg: >-
          {{ rollcall_names[idx] }}:
          {{ rollcall_comparison[idx].device }} =
          {{ rollcall_comparison[idx].slots }} node(s) [
          {{ rollcall_comparison[idx].slot_status
             | map(attribute='identity', default={})
             | map(attribute='address', default='?') | list | join(' ') }} ]
      loop: "{{ range(rollcall_names | length) | list }}"
      loop_control:
        loop_var: idx
        label: "{{ rollcall_names[idx] }}"

    - name: Keep the comparison beside the tables it was built from
      ansible.builtin.copy:
        content: |
          {{ dict(rollcall_names | zip(rollcall_comparison)) | to_nice_json }}
        dest: "{{ artifact_dir }}/comparison.json"
        mode: "0644"
      changed_when: false

    - name: Where the evidence is
      ansible.builtin.debug:
        msg: >-
          {{ node_tables.files | length }} node table(s) and comparison.json in
          {{ artifact_dir }} - diff two paths to see what a hop costs.
