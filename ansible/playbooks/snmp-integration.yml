---
# SNMP integration — ADR-0025 deliverable 3, tier 2/3.
#
# The oracle is a real agent: the ATEME Kyrion DR5000 at 10.6.255.114,
# SNMP v1 on 161, read community public / write community private (set
# on the unit's own web UI). Our own agent is the oracle for the other
# half of this connector, and `snmp-verbs.yml` drives that; here the
# manager is measured against kit we did not write.
#
# The fleet's SNMP devices live on the management fabric, which the
# control node can reach and a desk cannot, and the control node has no
# Go toolchain — so the suite is cross-compiled and shipped as a binary
# with the CLI it drives (DHS_BIN). Nothing is built on the target.
#
#   cd ansible
#   ansible-playbook -i inventory/hosts.ini playbooks/snmp-integration.yml
#   ansible-playbook -i inventory/hosts.ini playbooks/snmp-integration.yml   # -> changed=0
#
# Idempotent: it stages files (content-compared) and runs a suite whose
# only write is a SET of the value the object already holds, which the
# suite itself asserts comes back unchanged. Nothing on air moves.
#
# Secrets stay in the environment, never on a command line:
#   -e snmp_write_community=private   (or SNMP_WRITE_COMMUNITY in the shell)

- name: SNMP integration — stage the suite on the control node
  hosts: "{{ snmp_build_host | default('control') }}"
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/../.."
    stage: /root/snmp-integration
  tasks:
    - name: Staging directory
      ansible.builtin.file:
        path: "{{ stage }}"
        state: directory
        mode: "0755"

    - name: Is there a Go toolchain here?
      ansible.builtin.command: go version
      register: snmp_go
      changed_when: false
      failed_when: false

    - name: Build the CLI and the suite (needs Go on this host)
      when: snmp_go.rc == 0
      block:
        - name: Build dhs
          ansible.builtin.command:
            cmd: go build -o {{ stage }}/dhs ./cmd/dhs
            chdir: "{{ repo }}"
          changed_when: true
        - name: Build the integration test binary
          ansible.builtin.command:
            cmd: go test -c -tags integration -o {{ stage }}/snmp-integration.test ./internal/snmp/integration/
            chdir: "{{ repo }}"
          changed_when: true

    - name: Or take the binaries built elsewhere (-e snmp_bin_dir=…)
      when: snmp_go.rc != 0
      ansible.builtin.assert:
        that: snmp_bin_dir is defined
        fail_msg: >-
          This host has no Go toolchain. Cross-compile where there is one —
          GOOS=linux GOARCH=amd64 go build -o dhs ./cmd/dhs and
          go test -c -tags integration -o snmp-integration.test
          ./internal/snmp/integration/ — and pass -e snmp_bin_dir=<path>.

    - name: Stage the binaries built elsewhere
      when: snmp_go.rc != 0
      ansible.builtin.copy:
        src: "{{ snmp_bin_dir }}/{{ item }}"
        dest: "{{ stage }}/{{ item }}"
        mode: "0755"
      loop:
        - dhs
        - snmp-integration.test

    - name: Stage the shipped alarm template
      ansible.builtin.copy:
        src: "{{ repo }}/internal/snmp/alarm/DR5000@1.3.1.1.json"
        dest: "{{ stage }}/dr5000.alarm.json"
        mode: "0644"

- name: SNMP integration — drive the real agent
  hosts: "{{ snmp_test_host_group | default('control') }}"
  gather_facts: false
  vars:
    stage: /root/snmp-integration
    # Named apart from the -e override: a var that defaults to itself
    # is a recursion, not a default.
    agent: "{{ snmp_host | default('10.6.255.114') }}"
    write_community: "{{ snmp_write_community | default(lookup('env', 'SNMP_WRITE_COMMUNITY')) }}"
    # An object this plant agrees may be written, written back to the
    # value it already holds. On the DR5000 that is the SDI output
    # standard: same value in, nothing changes on air.
    writable_path: "{{ snmp_writable_path | default('ateme.dr5000.Channel.Configuration.Output.Mapping.Connector1') }}"
    watch_path: "{{ snmp_watch_path | default('ateme.dr5000.Status.Input.Sat') }}"
  tasks:
    - name: The agent answers at all
      ansible.builtin.command:
        cmd: "{{ stage }}/dhs consumer snmp get --version 1 --oid sysDescr.0 {{ agent }}"
      register: snmp_hello
      changed_when: false

    - name: What we are testing against
      ansible.builtin.debug:
        msg: "{{ agent }} — {{ snmp_hello.stdout_lines | first }}"

    - name: A write test needs the agent's own write community
      ansible.builtin.debug:
        msg: >-
          SNMP_WRITE_COMMUNITY is not set — the write checks will skip.
          Pass -e snmp_write_community=… to include them.
      when: write_community | length == 0

    # PASS / FAIL-real / FAIL-expected / TIMEOUT come from the suite
    # itself; the play runs it where the route is and keeps the whole
    # transcript when something does not pass.
    - name: Run the integration suite against the agent
      ansible.builtin.command:
        cmd: "{{ stage }}/snmp-integration.test -test.v"
        chdir: "{{ stage }}"
      environment:
        SNMP_TEST_HOST: "{{ agent }}"
        DHS_BIN: "{{ stage }}/dhs"
        SNMP_WRITE_COMMUNITY: "{{ write_community }}"
        SNMP_WRITABLE_PATH: "{{ writable_path }}"
        SNMP_WATCH_PATH: "{{ watch_path }}"
        SNMP_ALARM_TEMPLATE: "{{ stage }}/dr5000.alarm.json"
      register: snmp_suite
      changed_when: false
      failed_when: snmp_suite.rc != 0

    - name: Per-test verdicts
      ansible.builtin.debug:
        msg: "{{ snmp_suite.stdout_lines | select('match', '^(--- |ok|FAIL|PASS)') | list }}"

    - name: The whole transcript, when something did not pass
      when: snmp_suite.rc != 0
      ansible.builtin.debug:
        msg: "{{ snmp_suite.stdout_lines }}"
