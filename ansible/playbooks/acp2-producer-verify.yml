---
# acp2 producer oracle: our provider (`dhs producer acp2 serve`, the
# resident dhs-acp2 service deployed by acp2-producer.yml) as a third
# party sees it. The third party is the lab's Cerebrum, whose Neuron
# driver holds a session to it — ADR-0025 #3 / ADR-0034: a producer is
# proven by a client we did not write, not by our own consumer.
#
# What is asserted, from the producer's own counters:
#   - the controller is connected (an established session from its
#     address on the ACP2 port);
#   - it keeps asking and we keep answering — received and sent frame
#     counts both advance over the observation window;
#   - nothing it sent was undecodable, and nothing was answered with a
#     NAK, since the service started.
#
# What is NOT asserted here: a write made by the controller. That needs
# an operator action in Cerebrum and has no automated oracle yet.
#
# Read-only: nothing on the hosts or in Cerebrum changes; run-twice = 0
# changes.
#
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/acp2-producer-verify.yml

- name: acp2 — the producer as a third-party controller sees it
  hosts: plant
  gather_facts: false
  vars:
    a2v_port: 2072
    a2v_snapshot: http://127.0.0.1:9102/snapshot.json
    # The controller: the lab's Cerebrum (docs/testbed.md).
    a2v_controller: 10.6.250.5
    a2v_window_secs: 30
  tasks:
    - name: The producer service is active
      ansible.builtin.command: systemctl is-active dhs-acp2.service
      register: a2v_active
      changed_when: false

    - name: Released binary the service runs
      ansible.builtin.command: /usr/local/bin/dhs version
      register: a2v_version
      changed_when: false

    - name: Sessions established on the ACP2 port
      ansible.builtin.command: "ss -Htn state established sport = :{{ a2v_port }}"
      register: a2v_sessions
      changed_when: false

    - name: The controller holds a session
      ansible.builtin.assert:
        that: a2v_sessions.stdout is search(' ' ~ (a2v_controller | regex_escape) ~ ':')
        fail_msg: >-
          no established session from {{ a2v_controller }} on port {{ a2v_port }}
          — sessions: {{ a2v_sessions.stdout_lines }}
        quiet: true

    - name: Counters at the start of the window
      ansible.builtin.uri:
        url: "{{ a2v_snapshot }}"
        return_content: true
      register: a2v_before

    - name: "Observe for {{ a2v_window_secs }} s"
      ansible.builtin.pause:
        seconds: "{{ a2v_window_secs }}"

    - name: Counters at the end of the window
      ansible.builtin.uri:
        url: "{{ a2v_snapshot }}"
        return_content: true
      register: a2v_after

    - name: The controller asked, we answered, nothing was refused or undecodable
      ansible.builtin.assert:
        that:
          - a2v_after.json.connector.RxFrames > a2v_before.json.connector.RxFrames
          - a2v_after.json.connector.TxFrames > a2v_before.json.connector.TxFrames
          - a2v_after.json.connector.DecodeErrors == 0
          - a2v_after.json.connector.NAKs == 0
        fail_msg: >-
          rx {{ a2v_before.json.connector.RxFrames }} -> {{ a2v_after.json.connector.RxFrames }},
          tx {{ a2v_before.json.connector.TxFrames }} -> {{ a2v_after.json.connector.TxFrames }},
          decode errors {{ a2v_after.json.connector.DecodeErrors }}, NAKs {{ a2v_after.json.connector.NAKs }}
        quiet: true

    - name: Verdict
      ansible.builtin.debug:
        msg: >-
          acp2 producer green — {{ a2v_version.stdout_lines[0] }}; controller {{ a2v_controller }}
          connected; in {{ a2v_window_secs }} s it sent
          {{ a2v_after.json.connector.RxFrames - a2v_before.json.connector.RxFrames }} frame(s) and was sent
          {{ a2v_after.json.connector.TxFrames - a2v_before.json.connector.TxFrames }};
          since the service started: {{ a2v_after.json.connector.RxFrames }} received,
          {{ a2v_after.json.connector.TxFrames }} sent, 0 decode errors, 0 NAKs
