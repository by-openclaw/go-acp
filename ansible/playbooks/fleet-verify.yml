---
# Read-only drift check for the test fleet (#786, epic #780). Fails loudly
# when a host's live state no longer matches the inventory truth:
#   - every NIC IP declared in host_vars `nics:` is actually configured
#   - the guest hostname equals `fleet_hostname`
# Run from the control node:
#   ansible-playbook playbooks/fleet-verify.yml
# It also prints the MAC -> IP table for the pfSense static mappings.
- name: Verify fleet addressing and names against the inventory
  hosts: dhs_clients
  gather_facts: true
  tasks:
    - name: Collect live IPv4 addresses
      ansible.builtin.set_fact:
        fv_live_ips: >-
          {{ (ansible_ip_addresses | default([]) | select('match', '^\d+\.\d+\.\d+\.\d+$') | list)
             if ansible_os_family == 'Windows'
             else (ansible_all_ipv4_addresses | default([])) }}

    - name: "Every inventory NIC IP is live on {{ inventory_hostname }}"
      ansible.builtin.assert:
        that: item.ip in fv_live_ips
        fail_msg: >-
          DRIFT: {{ inventory_hostname }} {{ item.name }} ({{ item.mac }}) should be
          {{ item.ip }} but live IPv4s are {{ fv_live_ips | join(', ') }} —
          check the pfSense static mapping (#786).
        quiet: true
      loop: "{{ nics }}"
      loop_control:
        label: "{{ item.name }}={{ item.ip }}"

    - name: "Guest hostname equals fleet_hostname on {{ inventory_hostname }}"
      ansible.builtin.assert:
        that: (ansible_hostname | lower) == fleet_hostname
        fail_msg: "DRIFT: {{ inventory_hostname }} hostname is {{ ansible_hostname }}, expected {{ fleet_hostname }} (#783)"
        quiet: true

    # IPv6 exists on the platform (owner 2026-08-23); VLAN 100 offers no
    # RA/DHCPv6 yet, so hosts hold link-local only. Until the fleet's static
    # ip6 scheme lands in the inventory (dhs_netaddr, needs the VLAN-100
    # prefix), REPORT global IPv6 per host — it is not a drift (#804).
    - name: Collect live global IPv6 addresses
      ansible.builtin.set_fact:
        fv_live_v6: >-
          {{ (ansible_ip_addresses | default([]) | select('search', ':') | reject('match', '^fe80') | list)
             if ansible_os_family == 'Windows'
             else (ansible_all_ipv6_addresses | default([]) | reject('match', '^fe80') | list) }}

    - name: "Global IPv6 on {{ inventory_hostname }} (report; static ip6 scheme pending)"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} global IPv6: {{ (fv_live_v6 | join(', ')) if fv_live_v6 else 'none (link-local only)' }}"

    # NEVER use ansible_date_time here: facts are cached (ansible.cfg, #790),
    # so a cached epoch is stale by construction and the offset is nonsense.
    # Sample the clock LIVE on every host in the same task batch.
    - name: Live epoch (Linux)
      ansible.builtin.command: date -u +%s
      register: fv_epoch_posix
      changed_when: false
      when: ansible_os_family != 'Windows'

    - name: Live epoch (Windows)
      ansible.windows.win_shell: "[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()"
      register: fv_epoch_win
      changed_when: false
      when: ansible_os_family == 'Windows'

    # A Windows task costs ~15 s (#790), so its sample lands that much later in
    # wall-clock than the Linux batch. Take a FRESH control-node reading right
    # after the Windows sample, otherwise the skew looks like clock drift.
    - name: Reference epoch on the control node (paired with the Windows sample)
      ansible.builtin.command: date -u +%s
      register: fv_ref_after_win
      changed_when: false
      delegate_to: "{{ groups['control'][0] }}"
      when: ansible_os_family == 'Windows'

    - name: Resolve live epoch
      ansible.builtin.set_fact:
        fv_epoch: >-
          {{ (fv_epoch_win.stdout if ansible_os_family == 'Windows' else fv_epoch_posix.stdout)
             | trim | int }}

    # Separate task: every host's fv_epoch (incl. the control node's) must
    # exist before any host reads it out of hostvars.
    - name: Resolve the reference epoch for this host
      ansible.builtin.set_fact:
        fv_ref_epoch: >-
          {{ (fv_ref_after_win.stdout | trim | int)
             if ansible_os_family == 'Windows'
             else (hostvars[groups['control'][0]].fv_epoch | int) }}

    # The LXCs (control node included) inherit the Proxmox node clock — see
    # playbooks/pve-time.yml (#810) and the PTP decision (#813).
    - name: Clock offset vs the control node (live, seconds)
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} offset vs control node =
          {{ (fv_epoch | int) - (fv_ref_epoch | int) }}s
          (host {{ fv_epoch }}, control {{ fv_ref_epoch }}) — resolution ~1 s,
          minutes-scale drift is what matters

    - name: pfSense static-mapping table (MAC -> IP) for this host
      ansible.builtin.debug:
        msg: "{{ nics | map(attribute='mac') | zip(nics | map(attribute='ip')) | map('join', ' -> ') | list }}"
