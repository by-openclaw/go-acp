---
# Converge the test fleet (epic #780). Run from the control node
# (dhs-tools .104 since #820, repo clone ~/acp):
#
#   cd ~/acp/ansible
#   ansible-playbook playbooks/fleet-converge.yml          # apply
#   ansible-playbook playbooks/fleet-converge.yml          # again -> changed=0
#   ansible-playbook playbooks/fleet-converge.yml --check  # dry-run
#
# Roles land one per task issue: dhs_access (#782) · dhs_hostname (#783)
# · dhs_mdns (#784) · dhs_firewall (#785). fleet-verify.yml (#786) asserts
# the result without changing anything.
- name: Converge fleet access, names, mDNS and firewall
  hosts: dhs_clients
  gather_facts: true
  roles:
    # first: guest vCPU/RAM from the inventory truth (#817 P1). LXC changes
    # apply live; a VM delta is reported, never power-cycled.
    - dhs_guestsize
    - dhs_host
    - dhs_access
    - dhs_hostname
    - dhs_mdns
    - dhs_firewall
    # last: may reboot the CT to apply static addressing (#786); the control
    # node's own reboot ends the play — re-run afterwards = 0 changes.
    - dhs_netaddr
