---
# Cerebrum Network Media Server: the SubID of each NMOS node.
#
# A node registered with Cerebrum's NMOS registry has SubID 0 until it is
# given one; only then does it become a sub-device (slot) of the Network
# Media Server, and its senders and receivers show in IP routing.
#
# Everything comes from the inventory (group_vars/plant.yml):
#   cerebrum.host / cerebrum.rcp_port / cerebrum.nmos_device
#   cerebrum_nmos_subids: [{label: <IS-04 node label>, subid: <n>}]
# Nodes are matched by their LABEL: the uuid in Cerebrum's table is read
# at run time. The SubID values are plant data (NetBox, later).
#
# The object is `Nodes.[<uuid>].SubID` on the Network Media Server,
# written over RCP. A node that already holds its SubID is not written:
# run twice, the second run changes nothing.
#
# Credentials: the Cerebrum account, from the environment of the control
# node (DHS_CEREBRUM_USER / DHS_CEREBRUM_PASS) — never on a command line.
#
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/cerebrum-nmos-subid.yml
#   ... -e only=lab-convert-01        one node

- name: cerebrum — SubID of the NMOS nodes
  hosts: plant
  gather_facts: false
  vars:
    csi_bin: "{{ dhs_bin | default('/usr/local/bin/dhs') }}"
    csi_env:
      DHS_CEREBRUM_USER: "{{ lookup('ansible.builtin.env', 'DHS_CEREBRUM_USER') }}"
      DHS_CEREBRUM_PASS: "{{ lookup('ansible.builtin.env', 'DHS_CEREBRUM_PASS') }}"
    csi_obj: ["{{ csi_bin }}", consumer, rcp, object, "{{ cerebrum.host }}", --port, "{{ cerebrum.rcp_port | string }}",
              --device, "{{ cerebrum.nmos_device }}", --index, "0", --path]
    csi_wanted: "{{ cerebrum_nmos_subids | selectattr('label', 'equalto', only) | list if only is defined else cerebrum_nmos_subids }}"
  tasks:
    - name: The server, the nodes and the account are given
      ansible.builtin.assert:
        that:
          - cerebrum.host is defined and cerebrum.rcp_port is defined and cerebrum.nmos_device is defined
          - csi_wanted | length > 0
          - csi_env.DHS_CEREBRUM_USER | length > 0 and csi_env.DHS_CEREBRUM_PASS | length > 0
        fail_msg: set `cerebrum` and `cerebrum_nmos_subids` in the inventory, and DHS_CEREBRUM_USER / DHS_CEREBRUM_PASS in the environment
        quiet: true

    - name: Nodes known to the Network Media Server
      ansible.builtin.command:
        argv: "{{ csi_obj + ['Nodes'] }}"
      environment: "{{ csi_env }}"
      register: csi_table
      changed_when: false

    - name: Label of each node
      ansible.builtin.command:
        argv: "{{ csi_obj + ['Nodes.[' ~ item ~ '].Label'] }}"
      environment: "{{ csi_env }}"
      loop: "{{ (csi_table.stdout | regex_search('indices=\\[([^\\]]*)\\]', '\\1') | first).split(',') | reject('equalto', '') | list }}"
      register: csi_labels
      changed_when: false

    - name: Each wanted node, with its uuid
      ansible.builtin.set_fact:
        csi_nodes: >-
          {%- set out = [] -%}
          {%- for w in csi_wanted -%}
          {%- set hit = [] -%}
          {%- for r in csi_labels.results -%}
          {%- if (r.stdout_lines | select('match', '^value = ') | first | default('')) == 'value = ' ~ w.label -%}
          {%- set _ = hit.append(r.item) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set _ = out.append({'label': w.label, 'subid': w.subid | int, 'uuid': (hit[0] if hit | length == 1 else '')}) -%}
          {%- endfor -%}
          {{ out }}

    - name: Every label names exactly one node
      ansible.builtin.assert:
        that: csi_nodes | selectattr('uuid', 'equalto', '') | list | length == 0
        fail_msg: "not registered, or registered more than once: {{ csi_nodes | selectattr('uuid', 'equalto', '') | map(attribute='label') | list }}"
        quiet: true

    - name: SubID each node holds
      ansible.builtin.command:
        argv: "{{ csi_obj + ['Nodes.[' ~ item.uuid ~ '].SubID'] }}"
      environment: "{{ csi_env }}"
      loop: "{{ csi_nodes }}"
      loop_control:
        label: "{{ item.label }}"
      register: csi_now
      changed_when: false

    - name: Set the SubID
      ansible.builtin.command:
        argv: ["{{ csi_bin }}", consumer, rcp, set-object, "{{ cerebrum.host }}", --port, "{{ cerebrum.rcp_port | string }}",
               --device, "{{ cerebrum.nmos_device }}", --index, "0",
               --path, "Nodes.[{{ item.0.uuid }}].SubID", --value, "{{ item.0.subid | string }}"]
      environment: "{{ csi_env }}"
      loop: "{{ csi_nodes | zip(csi_now.results) | list }}"
      loop_control:
        label: "{{ item.0.label }} -> {{ item.0.subid }}"
      when: (item.1.stdout_lines | select('match', '^value = ') | first) != 'value = ' ~ item.0.subid

    - name: SubID each node holds now
      ansible.builtin.command:
        argv: "{{ csi_obj + ['Nodes.[' ~ item.uuid ~ '].SubID'] }}"
      environment: "{{ csi_env }}"
      loop: "{{ csi_nodes }}"
      loop_control:
        label: "{{ item.label }}"
      register: csi_after
      changed_when: false
      retries: 5
      delay: 2
      until: (csi_after.stdout_lines | select('match', '^value = ') | first) == 'value = ' ~ item.subid

    - name: Devices as Cerebrum now lists them
      ansible.builtin.command:
        argv: ["{{ csi_bin }}", consumer, rcp, devices, "{{ cerebrum.host }}", --port, "{{ cerebrum.rcp_port | string }}"]
      environment: "{{ csi_env }}"
      register: csi_devices
      changed_when: false

    - name: Result
      ansible.builtin.debug:
        msg:
          - "{{ csi_nodes | map(attribute='label') | zip(csi_nodes | map(attribute='subid')) | map('join', ' = ') | list }}"
          - "{{ csi_devices.stdout_lines | select('search', cerebrum.nmos_device) | list }}"
