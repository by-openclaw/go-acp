---
# Control-node prerequisites (dhs-debian .103), self-applied. Run once after a
# fresh clone and whenever requirements change:
#
#   cd ~/acp/ansible && ansible-playbook playbooks/control-node.yml
#
# - git-lfs + `git lfs pull` for the LFS-tracked assets the fleet roles ship
#   (Bonjour installer, PDFs) — without it a clone holds 132-byte pointers.
# - the Ansible collections from requirements.yml.
- name: Control node prerequisites
  hosts: control
  gather_facts: true
  tasks:
    - name: git + git-lfs present
      ansible.builtin.package:
        name: [git, git-lfs]
        state: present

    - name: git-lfs filters installed for root
      ansible.builtin.command: git lfs install --skip-repo
      register: cn_lfs_install
      changed_when: "'Git LFS initialized' in cn_lfs_install.stdout and 'already' not in cn_lfs_install.stdout"

    - name: LFS objects for the amwa assets pulled
      ansible.builtin.command:
        cmd: git lfs pull --include "internal/amwa/assets/*"
        chdir: "{{ playbook_dir }}/../.."
      register: cn_lfs_pull
      changed_when: "'Downloading' in cn_lfs_pull.stdout or (cn_lfs_pull.stderr is search('Downloading'))"

    - name: Bonjour installer is a real binary (> 1 MB)
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../internal/amwa/assets/BonjourPSSetup.exe"
      register: cn_bonjour
      failed_when: not cn_bonjour.stat.exists or cn_bonjour.stat.size < 1000000

    # Debian 12 ships ansible-core 2.14, which cannot drive Python 3.12
    # targets (Ubuntu 24.04: get_url/uri die with "HTTPSConnection ...
    # cert_file") and is below what ansible.windows supports. Install a
    # supported core via pipx (isolated venv) and put it first on PATH.
    - name: pipx present
      ansible.builtin.package:
        name: [pipx, python3-venv]
        state: present

    - name: "ansible-core {{ cn_ansible_core_spec }} via pipx"
      ansible.builtin.command:
        cmd: pipx install --force "ansible-core{{ cn_ansible_core_spec }}"
      register: cn_pipx
      changed_when: "'installed package' in cn_pipx.stdout"
      environment:
        PIPX_HOME: /opt/pipx
        PIPX_BIN_DIR: /usr/local/bin
      vars:
        cn_ansible_core_spec: ">=2.17,<2.18"

    - name: ansible --version (must be the pipx one)
      ansible.builtin.command: ansible --version
      register: cn_ansver
      changed_when: false
      failed_when: "'ansible [core 2.17' not in cn_ansver.stdout"

    # PSRP transport for the Windows host (#812) — pypsrp must live inside the
    # pipx venv that runs ansible, not in the system python.
    - name: pypsrp in the ansible-core venv (Windows PSRP transport)
      ansible.builtin.command: pipx inject ansible-core "pypsrp[credssp]>=0.5.0"
      register: cn_pypsrp
      changed_when: "'injected package' in cn_pypsrp.stdout"
      failed_when: cn_pypsrp.rc != 0 and 'already' not in (cn_pypsrp.stdout ~ cn_pypsrp.stderr)
      environment:
        PIPX_HOME: /opt/pipx
        PIPX_BIN_DIR: /usr/local/bin

    - name: Ansible collections from requirements.yml
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -r requirements.yml --upgrade
        chdir: "{{ playbook_dir }}/.."
      register: cn_galaxy
      changed_when: "'Installing' in cn_galaxy.stdout"
