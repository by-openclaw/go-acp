---
# probel-sw02p producer oracle: our provider (`dhs producer probel-sw02p serve`, the
# resident dhs-probel-sw02p service deployed by probel-sw02p-producer.yml) as a third
# party sees it. The third party is the lab's Cerebrum, whose router
# driver holds a session to it — ADR-0025 #3 / ADR-0034: a producer is
# proven by a client we did not write, not by our own consumer.
#
# What is asserted, from the producer's own counters:
#   - the controller is connected (an established session from its
#     address on the SW-P-02 port);
#   - it keeps asking and we keep answering — received and sent frame
#     counts both advance over the observation window;
#   - nothing it sent was undecodable, and nothing was answered with a
#     NAK, since the service started.
#
# What is NOT asserted here: a write made by the controller. That needs
# an operator action in Cerebrum and has no automated oracle yet.
#
# Read-only: nothing on the hosts or in Cerebrum changes; run-twice = 0
# changes.
#
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/probel-sw02p-producer-verify.yml

- name: probel-sw02p — the producer as a third-party controller sees it
  hosts: plant
  gather_facts: false
  vars:
    swv_port: 2002
    swv_snapshot: http://127.0.0.1:9104/snapshot.json
    # The controller: the lab's Cerebrum (docs/testbed.md).
    swv_controller: 10.6.250.5
    swv_window_secs: 30
  tasks:
    - name: The producer service is active
      ansible.builtin.command: systemctl is-active dhs-probel-sw02p.service
      register: swv_active
      changed_when: false

    - name: Released binary the service runs
      ansible.builtin.command: /usr/local/bin/dhs version
      register: swv_version
      changed_when: false

    - name: Sessions established on the SW-P-02 port
      ansible.builtin.command: "ss -Htn state established sport = :{{ swv_port }}"
      register: swv_sessions
      changed_when: false

    - name: The controller holds a session
      ansible.builtin.assert:
        that: swv_sessions.stdout is search(' ' ~ (swv_controller | regex_escape) ~ ':')
        fail_msg: >-
          no established session from {{ swv_controller }} on port {{ swv_port }}
          — sessions: {{ swv_sessions.stdout_lines }}
        quiet: true

    - name: Counters at the start of the window
      ansible.builtin.uri:
        url: "{{ swv_snapshot }}"
        return_content: true
      register: swv_before

    - name: "Observe for {{ swv_window_secs }} s"
      ansible.builtin.pause:
        seconds: "{{ swv_window_secs }}"

    - name: Counters at the end of the window
      ansible.builtin.uri:
        url: "{{ swv_snapshot }}"
        return_content: true
      register: swv_after

    - name: The controller asked, we answered, nothing was refused or undecodable
      ansible.builtin.assert:
        that:
          - swv_after.json.connector.RxFrames > swv_before.json.connector.RxFrames
          - swv_after.json.connector.TxFrames > swv_before.json.connector.TxFrames
          - swv_after.json.connector.DecodeErrors == 0
          - swv_after.json.connector.NAKs == 0
        fail_msg: >-
          rx {{ swv_before.json.connector.RxFrames }} -> {{ swv_after.json.connector.RxFrames }},
          tx {{ swv_before.json.connector.TxFrames }} -> {{ swv_after.json.connector.TxFrames }},
          decode errors {{ swv_after.json.connector.DecodeErrors }}, NAKs {{ swv_after.json.connector.NAKs }}
        quiet: true

    - name: Verdict
      ansible.builtin.debug:
        msg: >-
          probel-sw02p producer green — {{ swv_version.stdout_lines[0] }}; controller {{ swv_controller }}
          connected; in {{ swv_window_secs }} s it sent
          {{ swv_after.json.connector.RxFrames - swv_before.json.connector.RxFrames }} frame(s) and was sent
          {{ swv_after.json.connector.TxFrames - swv_before.json.connector.TxFrames }};
          since the service started: {{ swv_after.json.connector.RxFrames }} received,
          {{ swv_after.json.connector.TxFrames }} sent, 0 decode errors, 0 NAKs
