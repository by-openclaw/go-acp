---
# acp2 Tier-2/3 oracle: every consumer verb against the REAL EVS
# Neuron, Ansible-driven per ADR-0025 #5 (issue #969) — the read verbs
# and the write verbs.
#
# The write verbs (set / ensure / import) are proven on the device too:
# one harmless object — "Front Panel LED" on the rack controller
# (Normal / Heartbeat) — is read, written, read back from the
# device, converged, re-imported and put back as it was, whatever
# happens in between (`always`). This play said "read-only by ruling"
# until 2026-10-06; no such ruling existed, and the write verbs had
# never been proven against anything but our own provider.
#
# Every command task registers its result, so each receipt carries the
# module's own start/end/delta — per-verb timing without shell
# portability games. Nothing differs on the hosts or on the device
# after a run (receipts are evidence of the run, the object is
# restored), so run-twice = 0 changes.
#
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/acp2-neuron-verify.yml

- name: acp2 — real-Neuron oracle, every verb
  hosts: plant
  gather_facts: false
  vars:
    a2_bin: /usr/local/bin/dhs
    a2_host: 10.6.255.102
    a2_port: 2072
    # The big card (slot 1, CONVERT Hybrid) must expose a real tree —
    # thousands of objects, not the toy fixture's dozens.
    a2_slot1_min_objects: 10000
    a2_watch_secs: 20
    # The object the write verbs use: slot 0 (rack controller), id 47427
    # "Front Panel LED" — an RW enum, Normal or Heartbeat. Not "Find my
    # Neuron": once that one is switched on, the device refuses writes
    # to it for about fifteen seconds ("no access") — the device's own
    # guard, and not something a verb test should be timed around.
    a2_w_slot: 0
    a2_w_id: 47427
    a2_w_on: "Heartbeat"
    a2_w_off: "Normal"
  tasks:
    # Frozen once — a lazy lookup in vars: re-evaluates per task and
    # every task would compute a different timestamp directory.
    - name: Receipts path (one timestamp for the whole run)
      ansible.builtin.set_fact:
        a2_out: "/root/acp2-neuron-verify/{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%S') }}"

    - name: Receipts directory
      ansible.builtin.file:
        path: "{{ a2_out }}"
        state: directory
        mode: "0755"
      changed_when: false

    - name: info — device identity + slot status
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 info {{ a2_host }} --port {{ a2_port }}
      register: a2_info
      changed_when: false
      failed_when: a2_info.rc != 0 or 'slots' not in a2_info.stdout

    - name: walk slot 0 — full DFS with JSONL capture
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 walk {{ a2_host }} --port {{ a2_port }}
        --slot 0 --capture {{ a2_out }}/walk-slot0.jsonl
      register: a2_walk0
      changed_when: false
      failed_when: a2_walk0.rc != 0 or not (a2_walk0.stdout is regex('slot 0 — [0-9]+ objects'))

    - name: walk slot 1 — the 40k-object card, captured
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 walk {{ a2_host }} --port {{ a2_port }}
        --slot 1 --capture {{ a2_out }}/walk-slot1.jsonl
      register: a2_walk1
      changed_when: false
      failed_when: a2_walk1.rc != 0

    - name: walk slot 1 — a real tree, not a toy
      ansible.builtin.assert:
        that:
          - (a2_walk1.stdout | regex_search('slot 1 — [0-9]+ objects') | regex_replace('[^0-9]', '') | int) >= a2_slot1_min_objects
        fail_msg: >-
          slot 1 walked {{ a2_walk1.stdout | regex_search('slot 1 — [0-9]+ objects') }}
          — below the {{ a2_slot1_min_objects }}-object floor of a real CONVERT Hybrid

    - name: get — one known leaf by numeric id
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 get {{ a2_host }} --port {{ a2_port }}
        --slot 0 --id 20783
      register: a2_get
      changed_when: false
      failed_when: a2_get.rc != 0 or 'value =' not in a2_get.stdout

    - name: export — json / yaml / csv of slot 0
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 export {{ a2_host }} --port {{ a2_port }}
        --slot 0 --format {{ item }} --out {{ a2_out }}/slot0.{{ item }}
      loop: [json, yaml, csv]
      register: a2_export
      changed_when: false

    - name: export files are non-empty
      ansible.builtin.stat:
        path: "{{ a2_out }}/slot0.{{ item }}"
      loop: [json, yaml, csv]
      register: a2_export_stat
      failed_when: not a2_export_stat.stat.exists or a2_export_stat.stat.size == 0

    - name: diag — AN2 diagnostic probes
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 diag {{ a2_host }} --port {{ a2_port }}
      register: a2_diag
      changed_when: false

    - name: watch — live announces for {{ a2_watch_secs }}s, captured
      ansible.builtin.command: >-
        timeout {{ a2_watch_secs + 5 }} {{ a2_bin }} consumer acp2 watch
        {{ a2_host }} --port {{ a2_port }} --slot 1
        --capture {{ a2_out }}/announces.jsonl
      register: a2_watch
      changed_when: false
      # timeout(1) exits 124 when it cuts the watch — that IS the pass.
      failed_when: a2_watch.rc not in [0, 124]

    - name: announces actually flowed (a silent Neuron is a dead session)
      ansible.builtin.stat:
        path: "{{ a2_out }}/announces.jsonl"
      register: a2_ann
      failed_when: not a2_ann.stat.exists or a2_ann.stat.size == 0

    - name: validate — offline decode of the slot-1 capture
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 validate {{ a2_out }}/walk-slot1.jsonl
      register: a2_validate
      changed_when: false
      failed_when: a2_validate.rc != 0 or 'decoded' not in a2_validate.stdout

    - name: health — reachable, connected, live
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 health {{ a2_host }} --port {{ a2_port }}
      register: a2_health
      changed_when: false
      failed_when: >-
        a2_health.rc != 0 or 'reachable=true' not in a2_health.stdout
        or 'connected=true' not in a2_health.stdout or 'live=true' not in a2_health.stdout

    - name: tree — the rack controller as a tree
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 tree {{ a2_host }} --port {{ a2_port }} --slot 0
      register: a2_tree
      changed_when: false
      failed_when: a2_tree.rc != 0 or 'Card Name' not in a2_tree.stdout

    - name: extract — the DM triple of slot 0, twice
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 extract {{ a2_host }} --port {{ a2_port }}
        --protocol acp2 --manufacturer evs --product neuron-rack --direction consumer
        --version live --slot 0 --out {{ a2_out }}/dm-{{ item }}
      loop: [a, b]
      register: a2_extract
      changed_when: false
      failed_when: a2_extract.rc != 0 or 'extract complete' not in a2_extract.stdout

    - name: diff — two extracts of the same device
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 diff {{ a2_out }}/dm-a/tree.json {{ a2_out }}/dm-b/tree.json
      register: a2_diff
      changed_when: false

    # ---- write verbs, on the device. The original value is read first
    # and put back in `always`.
    - name: write verbs — the object as the device has it
      ansible.builtin.command: >-
        {{ a2_bin }} consumer acp2 get {{ a2_host }} --port {{ a2_port }}
        --slot {{ a2_w_slot }} --id {{ a2_w_id }}
      register: a2_w_before
      changed_when: false
      failed_when: a2_w_before.rc != 0 or not (a2_w_before.stdout is search('value = "' ~ a2_w_on ~ '"|value = "' ~ a2_w_off ~ '"'))

    - name: write verbs — remember it
      ansible.builtin.set_fact:
        a2_w_orig: "{{ a2_w_on if ('value = \"' ~ a2_w_on ~ '\"') in a2_w_before.stdout else a2_w_off }}"

    - name: write verbs on the real Neuron
      block:
        - name: set — start from "{{ a2_w_off }}"
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 set {{ a2_host }} --port {{ a2_port }}
            --slot {{ a2_w_slot }} --id {{ a2_w_id }} --value {{ a2_w_off }}
          changed_when: false

        - name: export — the snapshot the import will apply, taken at "{{ a2_w_off }}"
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 export {{ a2_host }} --port {{ a2_port }}
            --slot {{ a2_w_slot }} --format json --out {{ a2_out }}/import-source.json
          changed_when: false

        - name: set — write "{{ a2_w_on }}"
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 set {{ a2_host }} --port {{ a2_port }}
            --slot {{ a2_w_slot }} --id {{ a2_w_id }} --value {{ a2_w_on }}
          register: a2_set
          changed_when: false
          failed_when: a2_set.rc != 0 or ('confirmed value = "' ~ a2_w_on ~ '"') not in a2_set.stdout

        - name: set — the device itself now reads "{{ a2_w_on }}"
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 get {{ a2_host }} --port {{ a2_port }}
            --slot {{ a2_w_slot }} --id {{ a2_w_id }}
          register: a2_set_read
          changed_when: false
          failed_when: a2_set_read.rc != 0 or ('value = "' ~ a2_w_on ~ '"') not in a2_set_read.stdout

        - name: ensure — already converged, nothing written
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 ensure {{ a2_host }} --port {{ a2_port }}
            --slot {{ a2_w_slot }} --id {{ a2_w_id }} --value {{ a2_w_on }}
          register: a2_ensure_same
          changed_when: false
          failed_when: a2_ensure_same.rc != 0 or 'changed=false' not in a2_ensure_same.stdout

        - name: import — the dry run names the one object it would write
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 import {{ a2_host }} --port {{ a2_port }}
            --file {{ a2_out }}/import-source.json --slot {{ a2_w_slot }} --id {{ a2_w_id }} --dry-run
          register: a2_import_dry
          changed_when: false
          failed_when: a2_import_dry.rc != 0 or 'would apply 1' not in a2_import_dry.stdout

        - name: import — the dry run wrote nothing
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 get {{ a2_host }} --port {{ a2_port }}
            --slot {{ a2_w_slot }} --id {{ a2_w_id }}
          register: a2_import_dry_read
          changed_when: false
          failed_when: ('value = "' ~ a2_w_on ~ '"') not in a2_import_dry_read.stdout

        - name: import — the value of the snapshot is written back
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 import {{ a2_host }} --port {{ a2_port }}
            --file {{ a2_out }}/import-source.json --slot {{ a2_w_slot }} --id {{ a2_w_id }}
          register: a2_import
          changed_when: false
          failed_when: a2_import.rc != 0 or not (a2_import.stdout is search('appl(y|ied) 1'))

        - name: import — the device itself now reads "{{ a2_w_off }}"
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 get {{ a2_host }} --port {{ a2_port }}
            --slot {{ a2_w_slot }} --id {{ a2_w_id }}
          register: a2_import_read
          changed_when: false
          failed_when: ('value = "' ~ a2_w_off ~ '"') not in a2_import_read.stdout

        - name: ensure — not converged, written once
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 ensure {{ a2_host }} --port {{ a2_port }}
            --slot {{ a2_w_slot }} --id {{ a2_w_id }} --value {{ a2_w_on }}
          register: a2_ensure_diff
          changed_when: false
          failed_when: a2_ensure_diff.rc != 0 or 'changed=true' not in a2_ensure_diff.stdout

        - name: ensure — the device itself now reads "{{ a2_w_on }}"
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 get {{ a2_host }} --port {{ a2_port }}
            --slot {{ a2_w_slot }} --id {{ a2_w_id }}
          register: a2_ensure_read
          changed_when: false
          failed_when: ('value = "' ~ a2_w_on ~ '"') not in a2_ensure_read.stdout
      always:
        - name: write verbs — the object is put back as the device had it
          ansible.builtin.command: >-
            {{ a2_bin }} consumer acp2 set {{ a2_host }} --port {{ a2_port }}
            --slot {{ a2_w_slot }} --id {{ a2_w_id }} --value {{ a2_w_orig }}
          register: a2_w_restore
          changed_when: false
          failed_when: a2_w_restore.rc != 0 or ('confirmed value = "' ~ a2_w_orig ~ '"') not in a2_w_restore.stdout

    - name: Per-verb timing receipts (module start/end deltas)
      ansible.builtin.copy:
        content: |
          acp2 real-Neuron oracle — {{ a2_host }}:{{ a2_port }} — per-verb timing
          info           {{ a2_info.delta }}
          walk slot0     {{ a2_walk0.delta }}   ({{ a2_walk0.stdout | regex_search('slot 0 — [0-9]+ objects') }})
          walk slot1     {{ a2_walk1.delta }}   ({{ a2_walk1.stdout | regex_search('slot 1 — [0-9]+ objects') }})
          get            {{ a2_get.delta }}
          diag           {{ a2_diag.delta }}
          export json    {{ a2_export.results[0].delta }}
          export yaml    {{ a2_export.results[1].delta }}
          export csv     {{ a2_export.results[2].delta }}
          validate       {{ a2_validate.delta }}   ({{ a2_validate.stdout_lines | select('search', 'decoded') | first | default('') }})
          health         {{ a2_health.delta }}
          tree           {{ a2_tree.delta }}
          extract        {{ a2_extract.results[0].delta }}
          diff           {{ a2_diff.delta }}
          set            {{ a2_set.delta }}
          ensure same    {{ a2_ensure_same.delta }}
          import dry     {{ a2_import_dry.delta }}
          import         {{ a2_import.delta }}
          ensure write   {{ a2_ensure_diff.delta }}
          write object   slot {{ a2_w_slot }} id {{ a2_w_id }}: was "{{ a2_w_orig }}", restored to "{{ a2_w_orig }}"
        dest: "{{ a2_out }}/TIMINGS.txt"
        mode: "0644"
      changed_when: false

    # ---- the Go suite (internal/acp2/integration), same device, same
    # released CLI. It is cross-compiled where there is a Go toolchain
    # and handed over with -e acp2_suite_dir=<dir holding
    # acp2-integration.test>:
    #   GOOS=linux GOARCH=amd64 go test -c -tags integration \
    #       -o <dir>/acp2-integration.test ./internal/acp2/integration/
    # Without it the CLI checks above still stand; with it, a suite that
    # does not pass fails the play.
    - name: Go suite — staged beside the receipts
      ansible.builtin.copy:
        src: "{{ acp2_suite_dir }}/acp2-integration.test"
        dest: "{{ a2_out }}/acp2-integration.test"
        mode: "0755"
      changed_when: false
      when: acp2_suite_dir is defined

    - name: Go suite — against the real Neuron, with the released CLI
      ansible.builtin.command:
        cmd: "{{ a2_out }}/acp2-integration.test -test.v -test.count=1 -test.timeout 10m"
        chdir: "{{ a2_out }}"
      environment:
        ACP2_TEST_HOST: "{{ a2_host }}"
        ACP2_TEST_PORT: "{{ a2_port }}"
        DHS_BIN: "{{ a2_bin }}"
      register: a2_suite
      changed_when: false
      failed_when: >-
        a2_suite.rc != 0 or '--- PASS: TestACP2CLIRoundTrip' not in a2_suite.stdout
      when: acp2_suite_dir is defined

    - name: Go suite — verdicts
      ansible.builtin.debug:
        msg: "{{ a2_suite.stdout_lines | select('match', '^\\s*(--- |ok|PASS|FAIL)') | list }}"
      when: acp2_suite_dir is defined

    - name: Verdict
      ansible.builtin.debug:
        msg: >-
          acp2 oracle green vs {{ a2_host }}:{{ a2_port }} —
          {{ a2_walk1.stdout | regex_search('slot 1 — [0-9]+ objects') }},
          walk1 {{ a2_walk1.delta }}, receipts in {{ a2_out }}
