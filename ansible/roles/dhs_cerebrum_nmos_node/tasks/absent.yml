---
# absent: SubID 0 -> back on slot 00 -> NMOS off (device) -> line without
# address -> Forget -> line gone. A node with no line is already absent.
# Cerebrum is read and written over RCP; every read is ONE `rcp objects`
# call, one login.

- name: "{{ cerebrum_nmos_node_label }} — node lines in Cerebrum"
  ansible.builtin.command:
    argv: "{{ cnn_objects + ['--read', '0 Nodes'] }}"
  register: cnn_nodes
  changed_when: false
  environment: &cnn_env
    DHS_CEREBRUM_USER: "{{ lookup('ansible.builtin.env', 'DHS_CEREBRUM_USER') }}"
    DHS_CEREBRUM_PASS: "{{ lookup('ansible.builtin.env', 'DHS_CEREBRUM_PASS') }}"

- name: "{{ cerebrum_nmos_node_label }} — the lines, by their index"
  ansible.builtin.set_fact:
    cnn_ids: "{{ (cnn_nodes.stdout.split(cnn_tab)[4] | default('')).split(',') | reject('equalto', '') | list }}"

- name: "{{ cerebrum_nmos_node_label }} — label of each line"
  ansible.builtin.command:
    argv: >-
      {%- set out = cnn_objects | list -%}
      {%- for i in cnn_ids -%}{%- set _ = out.extend(['--read', '0 Nodes.[' ~ i ~ '].Label']) -%}{%- endfor -%}
      {{ out }}
  register: cnn_labels
  changed_when: false
  environment: *cnn_env
  when: cnn_ids | length > 0

- name: "{{ cerebrum_nmos_node_label }} — its line"
  ansible.builtin.set_fact:
    cnn_id: >-
      {%- set hit = [] -%}
      {%- for l in (cnn_labels.stdout_lines | default([])) -%}
      {%- set f = l.split(cnn_tab) -%}
      {%- if f[2] == 'value' and f[3] == cerebrum_nmos_node_label -%}{%- set _ = hit.append(cnn_ids[loop.index0]) -%}{%- endif -%}
      {%- endfor -%}
      {{ hit | first | default('') }}

- name: "{{ cerebrum_nmos_node_label }} — NMOS off (no line in Cerebrum)"
  ansible.builtin.include_tasks: nmos_switch.yml
  vars:
    cnn_on: false
    cnn_sw: "{{ cnn_driver }}"
  when: cnn_id == ''

- name: "{{ cerebrum_nmos_node_label }}"
  ansible.builtin.debug:
    msg: "absent — no line in Cerebrum"
  when: cnn_id == ''

- name: "{{ cerebrum_nmos_node_label }} — SubID 0, NMOS off, Forget"
  when: cnn_id != ''
  environment: *cnn_env
  vars:
    cnn_row: "Nodes.[{{ cnn_id }}]"
  block:
    - name: "{{ cerebrum_nmos_node_label }} — SubID it holds"
      ansible.builtin.command:
        argv: "{{ cnn_objects + ['--read', '0 ' ~ cnn_row ~ '.SubID'] }}"
      register: cnn_now
      changed_when: false

    - name: "{{ cerebrum_nmos_node_label }} — its devices, as the registry has them"
      ansible.builtin.uri:
        url: "{{ cnn_registry }}/devices?node_id={{ cnn_id }}&paging.limit={{ cerebrum.nmos_page_limit }}"
        return_content: true
      register: cnn_reg_devs
      when: cnn_now.stdout.split(cnn_tab)[3] != '0'

    - name: "{{ cerebrum_nmos_node_label }} — SubID -> 0, once"
      ansible.builtin.command:
        argv: "{{ cnn_set_object + [cnn_row ~ '.SubID', '--value', '0'] }}"
      when: cnn_now.stdout.split(cnn_tab)[3] != '0'
      register: cnn_set

    # A slot that no longer exists cannot be read: the move back is read
    # on slot 00, where the entry of the node lists its devices again.
    - name: "{{ cerebrum_nmos_node_label }} — back on slot 00 with every device"
      ansible.builtin.command:
        argv: "{{ cnn_objects + ['--read', '0 ' ~ cnn_row ~ '.Devices'] }}"
      register: cnn_entry
      until: cnn_entry.rc == 0 and cnn_entry.stdout.split(cnn_tab)[2] == 'table' and cnn_entry.stdout.split(cnn_tab)[3] == cnn_reg_devs.json | length | string
      retries: "{{ cerebrum.nmos_wait_retries }}"
      delay: "{{ cerebrum.nmos_wait_delay }}"
      changed_when: false
      when: cnn_set is changed

    - name: "{{ cerebrum_nmos_node_label }} — leave Cerebrum alone before the device is touched"
      ansible.builtin.pause:
        seconds: "{{ cerebrum.nmos_settle }}"
      when: cnn_set is changed

    - name: "{{ cerebrum_nmos_node_label }} — NMOS off"
      ansible.builtin.include_tasks: nmos_switch.yml
      vars:
        cnn_on: false
        cnn_sw: "{{ cnn_driver }}"

    # A line that has lost its address holds no HRef value any more.
    - name: "{{ cerebrum_nmos_node_label }} — the line has no address"
      ansible.builtin.command:
        argv: "{{ cnn_objects + ['--read', '0 ' ~ cnn_row ~ '.HRef'] }}"
      register: cnn_href
      until: cnn_href.rc == 0 and (cnn_href.stdout.split(cnn_tab)[2] == 'none' or (cnn_href.stdout.split(cnn_tab)[2] == 'value' and cnn_href.stdout.split(cnn_tab)[3] == ''))
      retries: "{{ cerebrum.nmos_wait_retries }}"
      delay: "{{ cerebrum.nmos_wait_delay }}"
      changed_when: false

    - name: "{{ cerebrum_nmos_node_label }} — Forget, once"
      ansible.builtin.command:
        argv: "{{ cnn_set_object + [cnn_row ~ '.Forget', '--value', '1'] }}"

    - name: "{{ cerebrum_nmos_node_label }} — the line is gone"
      ansible.builtin.command:
        argv: "{{ cnn_objects + ['--read', '0 Nodes'] }}"
      register: cnn_after
      until: cnn_after.rc == 0 and cnn_after.stdout.split(cnn_tab)[2] == 'table' and cnn_id not in (cnn_after.stdout.split(cnn_tab)[4] | default(''))
      retries: "{{ cerebrum.nmos_wait_retries }}"
      delay: "{{ cerebrum.nmos_wait_delay }}"
      changed_when: false

    - name: "{{ cerebrum_nmos_node_label }}"
      ansible.builtin.debug:
        msg: "absent — removed from Cerebrum (was SubID {{ cnn_now.stdout.split(cnn_tab)[3] }})"
