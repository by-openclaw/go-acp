---
# One NMOS node on Cerebrum's Network Media Server, present or absent.
# The node is named by its IS-04 label; its device, type and management
# address come from the site's devices.csv, its SubID from the inventory
# (cerebrum_nmos_subids), the registry from the site's site.csv, and the
# Cerebrum settings from the inventory (`cerebrum`, see group_vars).

cerebrum_nmos_node_state: present        # present | absent
cerebrum_nmos_node_label: ""             # IS-04 node label (devices.csv nmos_label)
cerebrum_nmos_node_site: lab
cerebrum_nmos_node_bin: /usr/local/bin/dhs

# Abstraction: the role asks a device for "NMOS on" or "NMOS off"; HOW is
# a driver, chosen by the protocol the device is configured with AND the
# version the device reports. A device whose protocol and version have no
# driver is refused: nothing is written with the objects of another
# version.

# The protocol each device type is configured with.
cerebrum_nmos_node_access:
  fusion6: mnset
  neuron-convert-hybrid: ccm
  neuron-shuffle: ccm
  neuron-view: rest

# The drivers, keyed "<protocol> <version as the device reports it>".
# `set` rows are parameters written with `dhs consumer <protocol> set
# --path`; {name} is a key of site.csv. A `rest` driver uses the API of
# the device itself (neuronview.api).
cerebrum_nmos_node_nmos:
  "ccm 7.0.3":                      # Neuron CONVERT Hybrid
    set:
      - {path: misc.nmos.mode, "on": "true", "off": "false"}
  "ccm 6.0.0-7e4a27e":              # Neuron Shuffler
    set:
      - {path: network.services.nmos.enable, "on": "true", "off": "false"}
  "mnset 0x68cd783f":               # FusioN 6: no NMOS switch, no registry = off
    set:
      - {path: self.diag.nmos.registry_address, "on": "{registry_host}:{registry_port}", "off": "0.0.0.0:0"}
      - {path: self.diag.nmos.registry_address_2, "on": "{registry_backup}", "off": "0.0.0.0:0"}
  "rest 1.13.0":                    # Neuron VIEW (Neuron MV API)
    set: []
