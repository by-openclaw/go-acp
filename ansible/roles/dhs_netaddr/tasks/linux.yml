---
# Proxmox renders a CT's guest network at every start — for an EL guest that is
# ifcfg-eth0 (IPADDR, GATEWAY, DNS1), which NetworkManager's profile then
# follows; for Debian/Ubuntu it is resolv.conf itself. A CT whose config was
# changed without a restart keeps what it booted with: measured on dhs-rocky
# 2026-09-17, CT config nameserver 10.6.240.1, live resolver still the retired
# 10.100.0.1 three weeks after the migration, because nobody had restarted it.
#
# Never edit the guest's NetworkManager profile to fix that. `nmcli dev
# reapply` on the fleet NIC took dhs-rocky off the network (2026-09-17); the
# CT restart is the mechanism, and it is what fixed it. So: if the live
# resolver is not what the inventory says, the CT is restarted (or, with
# dhs_netaddr_reboot_ct false, the play fails and says so).
- name: Live resolver
  ansible.builtin.command: grep -E '^nameserver' /etc/resolv.conf
  register: dhs_netaddr_resolv
  changed_when: false
  failed_when: false

- name: Does the live resolver match the inventory?
  ansible.builtin.set_fact:
    dhs_netaddr_resolver_stale: >-
      {{ (dhs_netaddr_resolv.stdout_lines | map('regex_replace', '^nameserver\s+', '') | list)
         != dhs_netaddr_dns }}

- name: A stale resolver is a CT that was never restarted after its config changed
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}: live resolver {{ dhs_netaddr_resolv.stdout_lines | join(' ') }}
      != inventory {{ dhs_netaddr_dns | join(' ') }}; restart the CT
      (dhs_netaddr_reboot_ct is false, so the play will not)
  when:
    - dhs_netaddr_resolver_stale | bool
    - not (dhs_netaddr_reboot_ct | bool)

- name: "Restart CT {{ pve_vmid }} so the guest network is re-rendered"
  ansible.builtin.include_tasks: reboot.yml
  when:
    - dhs_netaddr_resolver_stale | bool
    - dhs_netaddr_reboot_ct | bool
    - pve_vmid is defined
    - dhs_netaddr_proxmox_enabled | bool

# ---- leftovers: guest config for an interface the inventory does not declare.
#
# Proxmox renders the interfaces of the CT config and leaves alone whatever
# else the guest's files hold. A NIC removed from the CT (the parked mgmt-B
# port, the retired 10.100.0.0/24 rig network) therefore stays configured in
# the guest for ever: an `auto eth1` stanza for a device that no longer
# exists. On Debian that costs five minutes at every boot —
# ifupdown-wait-online waits for it, times out and fails, and everything
# ordered after network-online starts late: on dhs-debian the plant registry
# and the mirror, 5 min 10 s after a reboot that took 18 s (2026-10-05).
- name: Interfaces the guest's ifupdown file configures
  ansible.builtin.command: grep -oE '^iface (eth[0-9]+) ' /etc/network/interfaces
  register: dhs_netaddr_ifupdown
  changed_when: false
  failed_when: false

- name: Remove ifupdown stanzas of interfaces the inventory does not declare
  ansible.builtin.replace:
    path: /etc/network/interfaces
    regexp: '(?m)^(?:auto {{ item }}\n)?iface {{ item }} inet[^\n]*\n(?:[ \t]+[^\n]*\n)*(?:\n)?'
    replace: ''
  loop: >-
    {{ dhs_netaddr_ifupdown.stdout_lines | map('regex_replace', '^iface (eth[0-9]+) $', '\1')
       | unique | difference(nics | default([]) | map(attribute='name') | list) }}
  when:
    - dhs_netaddr_ifupdown.rc == 0
    - nics is defined

- name: systemd-networkd files of interfaces the guest has
  ansible.builtin.find:
    paths: /etc/systemd/network
    patterns: 'eth*.network'
  register: dhs_netaddr_networkd

- name: Remove networkd files of interfaces the inventory does not declare
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ dhs_netaddr_networkd.files }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - nics is defined
    - (item.path | basename | regex_replace('\.network$', '')) not in (nics | map(attribute='name') | list)
