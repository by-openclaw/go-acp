---
# dhs_rrcs — converge a Riedel RRCS gateway to a desired state.
#
# The role writes the desired state to a JSON file and runs
# `dhs consumer rrcs ensure` on it (ADR-0007): --check first, then the
# apply unless rrcs_check_only, then the same apply again to prove that a
# second run changes nothing. Ansible's changed status is the verb's own
# {changed} field.
#
# WHAT HAS PASSED ON A REAL RRCS 9.0 (2026-10-08): crosspoint levels, keys
# (create, label, mode, delete), conferences (create, delete), a stream put
# in manual mode with its address. WHAT STOPS RRCS: an edit of a stream
# that is, or becomes, NMOS — the verb refuses it (docs/adr/0035). Groups,
# IFBs, port labels, aliases, gains and client card settings have not met
# a real RRCS yet. Run with rrcs_check_only: true first, always.

dhs_bin: /usr/local/bin/dhs

# The RRCS to converge: host or host:port (default port 8193).
rrcs_host: ""

# Dry-run only: report what would change, send nothing. The default.
rrcs_check_only: true

# Required for an apply: the same value as rrcs_host. It is the write
# guard of the verb (--write-to); keeping it a separate variable makes a
# write a decision taken in the inventory, per host.
rrcs_write_to: ""

# Values by path, as `dhs consumer rrcs export` prints them. Examples:
#   net.1.node.60.card.1.Ptp.PTP: 100
#   net.1.node.60.card.1.Ptp.PtpPriority: 128
#   net.1.node.60.card.1.Nmos.RegistrationMode: Manual
#   net.1.node.60.card.1.Nmos.RegistrationIp: 10.0.0.15
#   net.1.node.60.card.1.Nmos.RegistrationPort: 8080
#   net.1.node.63.port.1045.out.PortAes67Output.Protocol: Manual
#   net.1.node.63.port.1045.out.PortAes67Output.Multicast: 239.5.63.45
#   net.1.node.63.port.1045.out.PortAes67Output.MulticastPort: 5004
rrcs_values: {}

# Crosspoints: [{source: PATH, destination: PATH, state: present|absent}].
rrcs_crosspoints: []

# Keys of panels. A key is EXPANSION.PAGE.KEY as `list keys` prints it
# (0.1.14 = main panel, first page, key 14). function is call-to-port,
# call-to-conference, call-to-group, call-to-ifb or reply; target is a port
# path, conference.ID, group.ID or ifb.ID; mode is auto, momentary or
# latching. state: absent empties the key and returns it to its automatic
# label.
#   - {panel: net.1.node.61.port.1024, key: "0.1.14", function: call-to-port,
#      target: net.1.node.61.port.1026, label: NOC2, mode: momentary}
#   - {panel: net.1.node.61.port.1024, key: "0.1.15", state: absent}
rrcs_keys: []

# Conferences, by id or — to create one — by name.
#   - {name: "Conference 040", label: "CONF 40"}
#   - {id: 257182184, state: absent}
rrcs_conferences: []

# Groups, by id or by name; members is the whole wanted list.
#   - {name: "Group NOC", label: NOC, members: [net.1.node.61.port.1024, net.1.node.61.port.1026]}
rrcs_groups: []

# IFBs, by number (an IFB cannot be created through RRCS). A leg is a port
# path, or "" for none. dim_level: 0 = 0 dB ... 6 = -24 dB, 7 = mute.
#   - {number: 7, label: SPORT, input: net.1.node.61.port.1040, mix_minus: "", dim_level: 4}
rrcs_ifbs: []

# Crosspoint levels: the level the destination hears the source at, in dB
# in steps of 0.5 (0 = unity), or mute. The level a panel sets on one of
# its keys is the crosspoint from that key's port to the panel.
#   - {source: net.1.node.61.port.1026, destination: net.1.node.61.port.1024, single: "-14.5"}
rrcs_levels: []

# Label, alias and gains of ports. A gain is dB in steps of 0.5 from -18
# to 18, or mute.
#   - {port: net.1.node.61.port.1040, label: CODIP01A, alias: "CODEC 1", input_gain: "0", output_gain: "-3.5"}
rrcs_ports: []

# Where the desired-state file is written on the managed host.
rrcs_desired_file: "/tmp/dhs-rrcs-desired-{{ rrcs_host | regex_replace('[^A-Za-z0-9.]', '_') }}.json"

# Extra flags for every run, e.g. [--capture, auto] or
# [--syslog-addr, "10.0.0.5:514"].
rrcs_extra_argv: []

# Prove idempotency after an apply: run it again and fail unless the
# second run reports changed=false.
rrcs_assert_idempotent: true

# Streams of an AES67 card: a main port and the ports linked to it. block: 8
# links the seven ports after the main one, channel 2 to 8, inputs and
# outputs; "linked" names them instead; "directions" keeps one side. RRCS
# does not report a link: a port counts as done when it uses the wanted
# channel. The channel count of the main output is not set (docs/adr/0035).
#   - {main: net.1.node.63.port.1072, block: 8}
rrcs_streams: []
