---
# Converge the secondary runner (#938). Idempotent — run-twice = 0
# changes once the actor key is committed and authorized.

# ---- 1. ansible-core via pipx (mirrors control-node.yml) -------------
- name: pipx present
  ansible.builtin.package:
    name: [pipx, python3-venv, git, git-lfs]
    state: present

- name: git-lfs filters installed for root
  ansible.builtin.command: git lfs install --skip-repo
  register: runner_lfs
  changed_when: "'Git LFS initialized' in runner_lfs.stdout and 'already' not in runner_lfs.stdout"

- name: "ansible-core {{ dhs_amwa_runner_ansible_core_spec }} via pipx"
  ansible.builtin.command:
    cmd: pipx install --force "ansible-core{{ dhs_amwa_runner_ansible_core_spec }}"
  register: runner_pipx
  changed_when: "'installed package' in runner_pipx.stdout"
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin

- name: ansible-playbook resolves to the pipx core
  ansible.builtin.command: ansible-playbook --version
  register: runner_ansver
  changed_when: false
  failed_when: "'core 2.17' not in runner_ansver.stdout"

# ---- 2. the runner's actor identity ---------------------------------
# Private key is born here and never leaves the runner. The .pub is
# fetched into the CONTROLLER's checkout so (a) the same play run can
# converge dhs_access with it and (b) it gets committed to the repo.
- name: Runner ed25519 actor key generated
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t ed25519 -N ""
      -C {{ dhs_amwa_runner_key_comment }}
      -f {{ dhs_amwa_runner_key }}
    creates: "{{ dhs_amwa_runner_key }}"

- name: Runner public key fetched into the dhs_access key store
  ansible.builtin.fetch:
    src: "{{ dhs_amwa_runner_key }}.pub"
    dest: "{{ role_path }}/../dhs_access/files/keys/{{ dhs_amwa_runner_key_comment }}.pub"
    flat: true

# ---- 3. SSH client config so plays target the fleet cleanly ---------
- name: Fleet SSH client config for the runner
  ansible.builtin.copy:
    dest: /root/.ssh/config
    mode: "0600"
    content: |
      # Managed by dhs_amwa_runner (#938). The runner drives Ansible at
      # the fleet as root with its own actor key.
      Host 10.6.250.* dhs-*
        User root
        IdentityFile {{ dhs_amwa_runner_key }}
        StrictHostKeyChecking accept-new

# The repo mirror lives in tasks/repo.yml and runs as a SEPARATE play
# after dhs_access has authorized the runner key on the fleet — the
# clone rides that key, so it cannot come earlier in the same play.
