---
# Runner repo mirror (#938) — runs AFTER dhs_access authorized the
# runner's actor key on the primary control node. Cloned over SSH from
# the plant checkout; refresh = fetch + hard reset so the runner always
# runs the exact tree the primary has.
- name: Runner repo cloned from the primary control node
  ansible.builtin.command:
    cmd: >-
      git clone
      root@{{ dhs_amwa_runner_origin_host }}:{{ dhs_amwa_runner_origin_path }}
      {{ dhs_amwa_runner_repo }}
    creates: "{{ dhs_amwa_runner_repo }}/.git"
  environment:
    GIT_SSH_COMMAND: "ssh -i {{ dhs_amwa_runner_key }} -o StrictHostKeyChecking=accept-new"

- name: Runner repo refreshed to the primary's checked-out branch
  ansible.builtin.shell:
    cmd: >-
      git fetch origin &&
      branch=$(git ls-remote --symref origin HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2}') &&
      git checkout -B "$branch" "origin/$branch" >/dev/null 2>&1 &&
      git rev-parse --short HEAD
  args:
    chdir: "{{ dhs_amwa_runner_repo }}"
  environment:
    GIT_SSH_COMMAND: "ssh -i {{ dhs_amwa_runner_key }} -o StrictHostKeyChecking=accept-new"
  register: runner_head
  changed_when: false

- name: Runner ready
  ansible.builtin.debug:
    msg: "runner at {{ inventory_hostname }}: repo {{ dhs_amwa_runner_repo }} @ {{ runner_head.stdout_lines[-1] }}"
