---
# One scoring round: bring the node up at ONE api_ver, run every suite
# against it, tear it down.

- name: "{{ api_ver }} — remove any previous node"
  ansible.builtin.command: docker rm -f {{ dhs_amwa_node_name }}
  changed_when: true
  failed_when: false

- name: "{{ api_ver }} — start the node on the oracle's bridge"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - -d
      - --name={{ dhs_amwa_node_name }}
      - --hostname={{ dhs_amwa_node_name }}
      - --network={{ dhs_amwa_project }}
      - --restart=no
      - "{{ dhs_amwa_node_image }}"
      - producer
      - nmos
      - serve
      - --config=/app/amwa-test-node.json
      - --bind=:{{ dhs_amwa_node_port }}
      # The node advertises the name the tool resolves it by. An href
      # naming the container's own IP is unreachable from anywhere the
      # tool would follow it to.
      - --advertise-host={{ dhs_amwa_node_name }}:{{ dhs_amwa_node_port }}
      - --mdns
      - --api-ver={{ api_ver }}
  changed_when: true

- name: "{{ api_ver }} — let the node register and settle"
  ansible.builtin.wait_for:
    timeout: "{{ dhs_amwa_node_settle }}"

# A suite run against a node that died on startup scores as a wall of
# failures and looks like a conformance problem. Checking first turns
# that into one honest error.
- name: "{{ api_ver }} — the node is running"
  ansible.builtin.command: docker inspect -f {% raw %}'{{.State.Running}}'{% endraw %} {{ dhs_amwa_node_name }}
  register: dhs_amwa_node_alive
  changed_when: false
  failed_when: "'true' not in dhs_amwa_node_alive.stdout"

# The tool calls ipaddress.ip_address() on the host field, so a
# container NAME throws where an address works. IS-04-01 tolerated the
# name; IS-05 does not, which is why the first IS-05 run produced a
# Python traceback rather than a score.
- name: "{{ api_ver }} — resolve the node''s address on the bridge"
  ansible.builtin.command: >-
    docker inspect -f
    {% raw %}'{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'{% endraw %}
    {{ dhs_amwa_node_name }}
  register: dhs_amwa_node_ip
  changed_when: false

- name: "{{ api_ver }} — node startup log"
  ansible.builtin.command: docker logs --tail 15 {{ dhs_amwa_node_name }}
  register: dhs_amwa_node_log
  changed_when: false

- name: "{{ api_ver }} — what the node said"
  ansible.builtin.debug:
    msg: "{{ (dhs_amwa_node_log.stderr | default('')) + (dhs_amwa_node_log.stdout | default('')) }}"

- name: "{{ api_ver }} — run the suites"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dhs_amwa_port_testing_ui }}/api"
    method: POST
    body_format: json
    body:
      suite: "{{ item.id }}"
      # One array slot per endpoint the suite declares, in ITS order.
      #
      # Every slot is this same node — a Node serves all its APIs on
      # one listener — but the VERSION differs per API, and that is the
      # part that cannot be guessed: passing the IS-04 minor to an
      # IS-05 suite makes the tool throw instead of score.
      #
      # host is an ADDRESS, never the container name: the tool calls
      # ipaddress.ip_address() on it and a name raises. IS-04-01
      # tolerated a name, IS-05 does not.
      #
      # An endpoint named "-" is left BLANK. Some suites disable the
      # host/port fields of one slot because the TOOL stands that API
      # up itself — IS-09-02 runs its own System API and checks the
      # Node goes and finds it. Filling that slot in points the tool at
      # our Node for an API it does not serve, and the suite dies on
      # "No API found ... (404)" before scoring anything. The slot
      # still has to EXIST: the arrays are positional and a short one
      # is refused outright.
      host: "{{ item.endpoints | map('extract', dhs_amwa_node_endpoint_hosts) | list }}"
      # Ports stay INTs — the tool type-checks them, so quoting turns a
      # scoring run into a 400.
      port: "{{ item.endpoints | map('extract', dhs_amwa_node_endpoint_ports) | map('int') | list }}"
      version: "{{ item.endpoints | map('extract', dhs_amwa_node_endpoint_vers) | list }}"
      # One selector slot per endpoint, empty unless the suite needs
      # one. IS-08 declares `selector: True`, and the tool refuses to
      # start with "No Selector(s) specified" rather than defaulting —
      # which scores as a suite that could not run, not as a failure.
      # An empty string means "the only instance", which is what a
      # device with one Channel Mapping API has.
      selector: "{{ item.endpoints | map('regex_replace', '^.*$', '') | list }}"
      output: json
    timeout: "{{ dhs_amwa_node_suite_timeout }}"
    status_code: [200, 400, 500]
    return_content: true
  register: dhs_amwa_node_run
  loop: "{{ dhs_amwa_node_suites }}"
  loop_control:
    label: "{{ item.id }} @ {{ api_ver }}"
  # A suite that errors is a RESULT, not a play failure: "the tool
  # refused to score this" is exactly the kind of gap this run exists
  # to surface, and stopping here would hide every later suite.
  failed_when: false

- name: "{{ api_ver }} — write each result"
  ansible.builtin.copy:
    content: "{{ item.content | default('{\"error\":\"no response\"}') }}"
    dest: "{{ dhs_amwa_node_results }}/{{ item.item.id | lower }}-{{ api_ver }}.json"
    mode: "0644"
  loop: "{{ dhs_amwa_node_run.results }}"
  loop_control:
    label: "{{ item.item.id }} @ {{ api_ver }}"

- name: "{{ api_ver }} — collect what was written"
  ansible.builtin.find:
    paths: "{{ dhs_amwa_node_results }}"
    patterns: "*.json"
  register: dhs_amwa_node_found
