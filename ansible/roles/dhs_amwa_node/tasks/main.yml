---
# Score our Node against the AMWA NMOS Testing Tool.
#
# Not idempotent in the run-twice-equals-zero-changes sense, and should
# not be: it is a measurement, and re-running it produces a fresh
# result set. What IS stable is the input — the image is rebuilt from
# the repo every time, so a score always names the source that earned
# it.

- name: The oracle must already be running
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dhs_amwa_port_testing_ui }}/"
    status_code: [200]
  register: dhs_amwa_node_tool
  failed_when: dhs_amwa_node_tool.status != 200

# Source staging goes over tar, not rsync.
#
# ansible.posix.synchronize needs rsync on BOTH the control node and
# the target, and neither of these slim LXCs ships it. Installing it in
# two places to move 7 MB once per run is a dependency bought for
# nothing — tar is in every base image, and the archive is built from
# `git ls-files` so the build context is exactly what is COMMITTED.
# That last part matters more than the transport: a conformance score
# has to name a commit, and staging the working tree would let a
# forgotten local edit into the number.
- name: Build a source archive from tracked files
  ansible.builtin.command:
    cmd: git ls-files -z
    chdir: "{{ playbook_dir }}/../.."
  register: dhs_amwa_node_tracked
  delegate_to: localhost
  changed_when: false

- name: Record the commit being scored
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ playbook_dir }}/../.."
  register: dhs_amwa_node_commit
  delegate_to: localhost
  changed_when: false

- name: Archive the tracked source (assets and testdata dropped — none of it compiles)
  ansible.builtin.shell:
    cmd: >-
      git ls-files -z
      | grep -zZv -e '^internal/[^/]*/assets/' -e 'testdata/' -e '^docs/' -e '^captures/'
      | tar --null -T - -czf /tmp/dhs-amwa-src.tgz
    chdir: "{{ playbook_dir }}/../.."
  delegate_to: localhost
  changed_when: true

- name: Stage directory
  ansible.builtin.file:
    path: "{{ dhs_amwa_node_dir }}/src"
    state: directory
    mode: "0755"

- name: Ship and unpack the source
  ansible.builtin.unarchive:
    src: /tmp/dhs-amwa-src.tgz
    dest: "{{ dhs_amwa_node_dir }}/src"
  register: dhs_amwa_node_sync

- name: Report the commit under test
  ansible.builtin.debug:
    msg: "scoring commit {{ dhs_amwa_node_commit.stdout | default('unknown') }}"

- name: Build the node image from that source
  ansible.builtin.command:
    cmd: >-
      docker build
      -f tests/integration/nmos/amwa/Dockerfile.node
      -t {{ dhs_amwa_node_image }}
      .
    chdir: "{{ dhs_amwa_node_dir }}/src"
  register: dhs_amwa_node_build
  changed_when: "'Successfully' in dhs_amwa_node_build.stdout or dhs_amwa_node_build.rc == 0"

- name: Results directory
  ansible.builtin.file:
    path: "{{ dhs_amwa_node_results }}"
    state: directory
    mode: "0755"

# The node is recreated per api_ver rather than reconfigured, because a
# node that has already registered at one minor is not the same subject
# as a fresh one — the tool's registration rounds observe first
# contact, and a re-used node has already had it.
- name: Score each API version
  ansible.builtin.include_tasks: round.yml
  loop: "{{ dhs_amwa_node_api_vers }}"
  loop_control:
    loop_var: api_ver

- name: Stop the node under test
  ansible.builtin.command: docker rm -f {{ dhs_amwa_node_name }}
  changed_when: true
  failed_when: false

- name: Fetch the results into the repo
  ansible.builtin.fetch:
    src: "{{ item }}"
    dest: "{{ dhs_amwa_node_fetch_to }}/"
    flat: true
  loop: "{{ dhs_amwa_node_found.files | map(attribute='path') | list }}"
  when: dhs_amwa_node_found.files | default([]) | length > 0

- name: Report where the numbers are
  ansible.builtin.debug:
    msg: >-
      {{ dhs_amwa_node_found.files | default([]) | length }} result file(s)
      fetched to tests/integration/nmos/amwa/results/ — score them with
      scripts/amwa/amwa-summarize.sh
