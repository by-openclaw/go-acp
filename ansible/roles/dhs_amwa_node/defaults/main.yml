---
# dhs_amwa_node — our Node under test, scored by the AMWA NMOS Testing
# Tool that dhs_amwa keeps running.
#
# The node joins the SAME bridge as the tool. That is not incidental:
# the IS-04 discovery rounds are mDNS, multicast flows between
# containers on one bridge, and a node reached across a routed boundary
# is only discoverable in the spec's unicast mode. Testing over the LAN
# would silently skip the discovery half of IS-04-01 and report a
# better score for a worse implementation.

# Where the source is staged and the image built.
dhs_amwa_node_dir: /opt/dhs-amwa-node
dhs_amwa_node_image: dhs-node:conformance
dhs_amwa_node_name: dhs-node
# Port the node serves on inside the bridge. Not published: only the
# testing tool needs to reach it, and it does so by container name.
dhs_amwa_node_port: 18080

# Which IS-04 minor the node serves for this round.
#
# Every minor AMWA has published is in scope (internal/amwa/CLAUDE.md,
# strict-spec rule) so conformance is measured once per minor, not once
# for the newest. The 2026-05-02 baseline is exactly why: v1.3 scored
# 55/74 while v1.1 scored 33/73, and a v1.3-only run would have called
# that healthy.
dhs_amwa_node_api_vers: ["v1.0", "v1.1", "v1.2", "v1.3"]

# The IS-05 minor served alongside each IS-04 round. Highest published,
# because the Connection API version is chosen independently of IS-04's
# — a v1.0 Node API and a v1.2 Connection API on one device is legal
# and common.
dhs_amwa_node_is05_ver: "v1.2"

# Suites, and the ENDPOINT LIST each one needs.
#
# This is the part that cannot be guessed. Every suite declares its own
# endpoint list in the tool's TEST_DEFINITIONS, and the request must
# supply host/port/version arrays of exactly that length, in that
# order. My first run passed the IS-04 minor to every suite and got
# tracebacks from IS-05 and IS-07 — the version array has to carry
# EACH spec's own minor, not the node's IS-04 one.
#
#   endpoints: which API each array slot addresses.
#     node        -> IS-04 Node API, version = the round's api_ver
#     connection  -> IS-05, version = dhs_amwa_node_is05_ver
#     events      -> IS-07 v1.0
#     chanmap     -> IS-08 v1.0
#     system      -> IS-09 v1.0
#
# Suites needing the testing-facade (IS-04-04, IS-05-03, the Controller
# rounds) are NOT here: they drive a controller, not a node, and need a
# driver that answers the tool's prompts.
dhs_amwa_node_suites:
  - id: "IS-04-01"
    name: "IS-04 Node API"
    endpoints: ["node"]
  - id: "IS-04-03"
    name: "IS-04 Node API (Peer to Peer)"
    endpoints: ["node"]
  - id: "IS-05-01"
    name: "IS-05 Connection Management API"
    endpoints: ["connection"]
  - id: "IS-05-02"
    name: "IS-05 Interaction with IS-04"
    endpoints: ["node", "connection"]
  - id: "IS-07-01"
    name: "IS-07 Event & Tally API"
    endpoints: ["events"]
  - id: "IS-07-02"
    name: "IS-07 Interaction with IS-04 and IS-05"
    endpoints: ["node", "connection", "events"]
  - id: "IS-08-01"
    name: "IS-08 Channel Mapping API"
    endpoints: ["chanmap"]
  - id: "IS-08-02"
    name: "IS-08 Interaction with IS-04"
    endpoints: ["node", "chanmap"]
  # Two slots even though the tool disables most of their fields: the
  # arrays are positional, and a short one is refused outright with
  # "expects 2 Hostname(s)/IP address(es), Port(s) and Version(s)".
  - id: "IS-09-02"
    name: "IS-09 System API Discovery"
    endpoints: ["node", "system"]

# Per-endpoint version map, resolved at request time.
dhs_amwa_node_endpoint_vers:
  node: "{{ api_ver | default('v1.3') }}"
  connection: "{{ dhs_amwa_node_is05_ver }}"
  events: "v1.0"
  chanmap: "v1.0"
  system: "v1.0"

# Where results land on the tooling host before being fetched back into
# the repo. A conformance number only means something next to the code
# that produced it.
dhs_amwa_node_results: "{{ dhs_amwa_node_dir }}/results"
dhs_amwa_node_fetch_to: "{{ playbook_dir }}/../../tests/integration/nmos/amwa/results"

# Seconds to let the node register and settle before scoring it. The
# tool's own cascade rounds are timing-sensitive; starting a suite
# against a node still coming up scores the startup, not the node.
dhs_amwa_node_settle: 8
# A full suite can run for minutes; the tool answers POST /api only when
# it has finished.
dhs_amwa_node_suite_timeout: 900
