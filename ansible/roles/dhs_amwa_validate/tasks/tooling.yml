---
# Converge the tooling host so a rebuilt dhs-tools replays to the same
# state — nothing here may live only in someone's shell history.
#
#   - docker uses the cgroupfs driver: this LXC's systemd never holds
#     its dbus name (org.freedesktop.systemd1 absent even after boot),
#     so the default systemd cgroup driver cannot create NEW
#     containers at all — existing ones start, new `docker run` fails
#     with "unable to start unit docker-….scope";
#   - the AMWA testing tool container exists, on HOST networking with
#     the host dbus (mDNS suites need real multicast + avahi), from
#     the pinned image;
#   - its UserConfig carries the conformance profile.

# The IS-07 MQTT broker lives HERE, not on the plant host: the fleet
# has no internet egress except this host, so this is the one place
# apt can install mosquitto. The plant node publishes to it and the
# testing tool subscribes — both by address, neither cares where it
# runs.
- name: Apt sources use HTTPS (fleet egress allows TCP 443 only)
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: "http://(archive|security)\\.ubuntu\\.com"
    replace: "https://\\1.ubuntu.com"

- name: Mosquitto is installed
  ansible.builtin.apt:
    name: mosquitto
    state: present
    update_cache: true
    cache_valid_time: 86400

# Port 1884, not the MQTT default: the nmos-cpp reference stack's
# registry container publishes ITS bundled mosquitto on 1883 of this
# same host.
- name: Mosquitto listens for the lab (open, LAN-only)
  ansible.builtin.copy:
    content: |
      listener 1884 0.0.0.0
      allow_anonymous true
    dest: /etc/mosquitto/conf.d/dhs-lab.conf
    mode: "0644"
  register: _mosq_cfg

- name: Mosquitto is running
  ansible.builtin.systemd:
    name: mosquitto
    state: "{{ 'restarted' if _mosq_cfg.changed else 'started' }}"
    enabled: true

- name: Docker uses the cgroupfs driver
  ansible.builtin.copy:
    content: |
      {
        "exec-opts": ["native.cgroupdriver=cgroupfs"]
      }
    dest: /etc/docker/daemon.json
    mode: "0644"
  register: _docker_cfg

- name: Restart docker on driver change
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: _docker_cfg.changed

- name: The tool container exists
  ansible.builtin.command: docker inspect -f {% raw %}"{{.State.Status}}"{% endraw %} {{ dhs_amwa_validate_tool_container }}
  register: _tool_state
  changed_when: false
  failed_when: false

- name: Create the tool container
  ansible.builtin.command: >-
    docker run -d --name {{ dhs_amwa_validate_tool_container }}
    --network host
    -v /run/dbus:/run/dbus
    --restart unless-stopped
    {{ dhs_amwa_validate_tool_image }}
  when: _tool_state.rc != 0
  changed_when: true

- name: The tool container is running
  ansible.builtin.command: docker start {{ dhs_amwa_validate_tool_container }}
  when: _tool_state.rc == 0 and 'running' not in _tool_state.stdout
  changed_when: true

- name: Render the conformance UserConfig
  ansible.builtin.copy:
    content: |
      PULL_REPOS = False
      from . import Config as CONFIG
      CONFIG.GARBAGE_COLLECTION_TIMEOUT = 30
    dest: /opt/dhs-validate-userconfig.py
    mode: "0644"
  register: _userconfig

- name: Pin the tool UserConfig
  ansible.builtin.shell: >-
    docker cp /opt/dhs-validate-userconfig.py {{ dhs_amwa_validate_tool_container }}:/config/UserConfig.py
    && docker restart {{ dhs_amwa_validate_tool_container }}
  when: _userconfig.changed or _tool_state.rc != 0
  changed_when: true

# ---- the auth-ARMED tool instance (issue #942) ----
# Third container, same pinned image, HOST networking + host dbus like
# the resident (its mock Authorization Server derives issuer/jwks_uri
# from the machine's default IP — a bridge would bake in an
# unreachable 172.x; IS-04-02's DNS-SD rounds also need real
# multicast). Shifted PORT_BASE because the resident owns 5000; the
# mock auth server follows at PORT_BASE+10.
- name: The auth tool container exists
  ansible.builtin.command: docker inspect -f {% raw %}"{{.State.Status}}"{% endraw %} {{ dhs_amwa_validate_auth_tool_container }}
  register: _auth_tool_state
  changed_when: false
  failed_when: false
  when: _validate_need_auth

# docker CREATE, not run: the tool must never execute with default
# config. With defaults PULL_REPOS=True kicks off git operations at
# startup, and the config pin's restart then lands mid `git reset`,
# leaving a stale cache .git/HEAD.lock that crash-loops the container
# forever (first fleet run of #942 hit exactly this). Config first,
# first start after.
- name: Create the auth tool container (stopped)
  ansible.builtin.command: >-
    docker create --name {{ dhs_amwa_validate_auth_tool_container }}
    --network host
    -v /run/dbus:/run/dbus
    --restart unless-stopped
    {{ dhs_amwa_validate_tool_image }}
  when: _validate_need_auth and _auth_tool_state.rc != 0
  changed_when: true

# Same conformance profile as the resident PLUS the armed knobs —
# ENABLE_AUTH is the tool's own switch (its receipts CONFIG dump names
# it), PORT_BASE moves the GUI/API + every PORT_BASE-relative mock,
# WEBSOCKET_PORT_BASE moves the WS mocks off the resident's range.
- name: Render the armed UserConfig
  ansible.builtin.copy:
    content: |
      PULL_REPOS = False
      from . import Config as CONFIG
      CONFIG.GARBAGE_COLLECTION_TIMEOUT = 30
      CONFIG.ENABLE_AUTH = True
      CONFIG.PORT_BASE = {{ dhs_amwa_validate_auth_port_base }}
      CONFIG.WEBSOCKET_PORT_BASE = {{ dhs_amwa_validate_auth_ws_port_base }}
    dest: /opt/dhs-validate-userconfig-auth.py
    mode: "0644"
  register: _auth_userconfig
  when: _validate_need_auth

- name: Pin the auth tool UserConfig
  ansible.builtin.shell: >-
    docker cp /opt/dhs-validate-userconfig-auth.py {{ dhs_amwa_validate_auth_tool_container }}:/config/UserConfig.py
    && docker restart {{ dhs_amwa_validate_auth_tool_container }}
  when: _validate_need_auth and (_auth_userconfig.changed or _auth_tool_state.rc != 0)
  changed_when: true

# After the pin so a first start always runs the armed config.
- name: The auth tool container is running
  ansible.builtin.command: docker start {{ dhs_amwa_validate_auth_tool_container }}
  when: _validate_need_auth and _auth_tool_state.rc == 0 and 'running' not in _auth_tool_state.stdout
  changed_when: true
