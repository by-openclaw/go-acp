---
# Registry CuT window: a transient registry on the plant host, from
# the plant's own (released) binary, holding what the exam puts there
# and nothing else. Two exams sit it:
#
#   plain (issue #1292)  the registry-scope IS-04-02. It used to be
#     scored on the plant registry itself; once the plant carried a
#     production catalogue (~7 000 resources) the tool's own SYNC-grain
#     validation outlasted the heartbeat window and test_31 evicted
#     its own node. A conformance exam is not a load test — scale has
#     its own numbers — so the exam gets a registry of its own.
#
#   auth (issue #942)    the same exam WITH IS-10: armed with
#     --auth-url so BOTH faces (Registration + Query) Bearer-gate and
#     api_auth=true is advertised. Resident units are never armed.
#
# The plant registry stays running and keeps its pri-0 announce. The
# transient announces under its own instance name at pri 99, plain or
# armed: in the production range (0-99; 100+ is development — IS-04
# §3), so the tool's advertisement rounds score a Pass rather than the
# "reserved for development" Warning, and still behind the plant's 0
# so no node prefers it. The armed one sat at 100 until #1312 and drew
# that Warning twice; a node that did fail over to it would be refused
# for want of a token, which costs nothing.
#
# The transient mirrors the plant registry's exam-shaping flags
# (dhs_amwa_plant's dhs-nmos-registry.service.j2): the tool's pinned
# GARBAGE_COLLECTION_TIMEOUT=30 profile assumes the 30 s heartbeat
# window, and the paging default changes which Query paging rounds
# the tool can score.
#
# Same transient unit name as the p2p window so window_teardown.yml
# closes either window identically.

- name: Note which side of the registry window this is
  ansible.builtin.set_fact:
    _cut_armed: "{{ suite.auth | default(false) }}"

- name: Start the transient registry CuT
  ansible.builtin.command: >-
    systemd-run --unit dhs-nmos-validate-cut --collect
    {{ dhs_amwa_validate_plant_bin }} registry nmos serve
    --bind 0.0.0.0:{{ dhs_amwa_validate_cut_port }}
    --advertise-host {{ dhs_amwa_validate_plant_host }}:{{ dhs_amwa_validate_cut_port }}
    --priority 99
    --instance-name dhs-nmos-validate-{{ 'auth' if _cut_armed else 'cut' }}
    --page-limit-default 1000
    --heartbeat-timeout 30s
    {{ ('--auth-url ' ~ dhs_amwa_validate_auth_server_url) if _cut_armed else '' }}
  delegate_to: "{{ groups['plant'][0] }}"
  changed_when: true

- name: Arm the CuT safety-stop timer
  ansible.builtin.command: >-
    systemd-run --unit dhs-nmos-validate-cutstop --collect
    --on-active={{ dhs_amwa_validate_window_safety_sec }}
    systemctl stop dhs-nmos-validate-cut
  delegate_to: "{{ groups['plant'][0] }}"
  changed_when: true

# An armed registry answers a tokenless probe with 401 — that IS the
# readiness proof (the Bearer gate is up before the tool knocks);
# 200 is the disarmed shape.
- name: Wait for the transient registry
  ansible.builtin.uri:
    url: "http://{{ dhs_amwa_validate_plant_host }}:{{ dhs_amwa_validate_cut_port }}/x-nmos/query/{{ suite.is04_ver | default('v1.3') }}/nodes"
    status_code: [200, 401]
  register: _cut_up
  retries: 15
  delay: 2
  until: _cut_up.status == (401 if _cut_armed else 200)

# ---- companion node -------------------------------------------------
# An empty registry leaves nine Query rounds "No resources found" (the
# first armed baseline, #942 follow-up S3c). The companion node
# registers a real resource graph INTO the transient so those rounds
# score — what the plant's own nodes did for the plain exam while it
# sat on the plant registry.
#
# Armed: credentials come from the mock Authorization Server's own RFC
# 7591 registration endpoint — read from its RFC 8414 metadata, never
# hardcoded — and the node arms with them via --auth-client-id/secret
# (the same client_credentials flow a production node would use).
- name: Read the Authorization Server metadata
  ansible.builtin.uri:
    url: "{{ dhs_amwa_validate_auth_server_url }}/.well-known/oauth-authorization-server"
    return_content: true
  register: _auth_meta
  when: _cut_armed

- name: Register the companion node as an OAuth client
  ansible.builtin.uri:
    url: "{{ _auth_meta.json.registration_endpoint }}"
    method: POST
    body_format: json
    body:
      client_name: dhs-nmos-validate-cutnode
      grant_types: [client_credentials]
      token_endpoint_auth_method: client_secret_basic
      scope: "registration query"
    status_code: [200, 201]
  register: _dcr
  no_log: true
  when: _cut_armed

- name: Start the companion node
  ansible.builtin.command: >-
    systemd-run --unit dhs-nmos-validate-cutnode --collect
    {{ dhs_amwa_validate_plant_bin }} producer nmos serve
    --bind 0.0.0.0:{{ dhs_amwa_validate_cutnode_port }}
    --no-mdns
    --registry http://{{ dhs_amwa_validate_plant_host }}:{{ dhs_amwa_validate_cut_port }}
    --advertise-host {{ dhs_amwa_validate_plant_host }}:{{ dhs_amwa_validate_cutnode_port }}
    --api-ver {{ suite.is04_ver | default('v1.3') }}
    --config {{ dhs_amwa_validate_plant_config }}
    {{ ('--auth-url ' ~ dhs_amwa_validate_auth_server_url
        ~ ' --auth-client-id ' ~ _dcr.json.client_id
        ~ ' --auth-client-secret ' ~ _dcr.json.client_secret) if _cut_armed else '' }}
  delegate_to: "{{ groups['plant'][0] }}"
  no_log: true
  changed_when: true

- name: Arm the companion-node safety-stop timer
  ansible.builtin.command: >-
    systemd-run --unit dhs-nmos-validate-cutnodestop --collect
    --on-active={{ dhs_amwa_validate_window_safety_sec }}
    systemctl stop dhs-nmos-validate-cutnode
  delegate_to: "{{ groups['plant'][0] }}"
  changed_when: true

# Proof of registration, not just liveness. Armed: fetch our own token
# (the registered client carries the query scope too) and poll the
# armed Query API until the companion's node document is in it.
- name: Fetch a verification token
  ansible.builtin.uri:
    url: "{{ _auth_meta.json.token_endpoint }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      scope: query
    url_username: "{{ _dcr.json.client_id }}"
    url_password: "{{ _dcr.json.client_secret }}"
    force_basic_auth: true
  register: _verify_tok
  no_log: true
  when: _cut_armed

- name: Carry the token where the window is armed
  ansible.builtin.set_fact:
    _cut_headers: "{{ {'Authorization': 'Bearer ' ~ _verify_tok.json.access_token} if _cut_armed else {} }}"
  no_log: true

- name: The companion node is registered in the transient registry
  ansible.builtin.uri:
    url: "http://{{ dhs_amwa_validate_plant_host }}:{{ dhs_amwa_validate_cut_port }}/x-nmos/query/{{ suite.is04_ver | default('v1.3') }}/nodes"
    headers: "{{ _cut_headers }}"
    return_content: true
  register: _cut_reg
  retries: 20
  delay: 3
  until: _cut_reg.status == 200 and (_cut_reg.json | length) >= 1
  no_log: true

# auto_query_18/19 page the /subscriptions collection; the plant
# resident always holds live ones (the mirror's), the fresh transient
# holds none. A persistent subscription (survives with no WS client
# attached) gives those rounds a resource to score.
- name: Seed a persistent subscription so the subscription rounds score
  ansible.builtin.uri:
    url: "http://{{ dhs_amwa_validate_plant_host }}:{{ dhs_amwa_validate_cut_port }}/x-nmos/query/{{ suite.is04_ver | default('v1.3') }}/subscriptions"
    method: POST
    body_format: json
    body:
      max_update_rate_ms: 100
      persist: true
      resource_path: /nodes
      params: {}
    headers: "{{ _cut_headers }}"
    status_code: [200, 201]
  no_log: true

# The catalog rows carry the registry target; point them at the
# transient instead of the plant resident.
- name: Point this suite at the transient registry
  ansible.builtin.set_fact:
    _suite_host_override: "{{ dhs_amwa_validate_plant_host }}"
    _suite_port_override: "{{ dhs_amwa_validate_cut_port }}"
