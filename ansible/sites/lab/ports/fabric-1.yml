---
# FABRIC-1 (DCS-7060CX-32S) port map — which port uses which profile.
# Profiles are defined by the arista_ports role from site.yml; `extra` holds
# per-port physical settings (speed / FEC). Unlisted ports are not managed.
ports:
  # Management edge (VLAN 600)
  Ethernet1/1: { profile: mgmt_access, desc: MGMT_CTRL-EDGE }
  Ethernet2/1: { profile: mgmt_access, desc: MGMT_CTRL-EDGE }
  Ethernet3/1: { profile: mgmt_access, desc: MGMT_CTRL-EDGE }
  Ethernet4/1: { profile: mgmt_access, desc: MGMT_CTRL-EDGE }
  Ethernet5/1: { profile: mgmt_access, desc: MGMT_CTRL-EDGE }
  Ethernet6/1: { profile: mgmt_access, desc: MGMT_CTRL-EDGE }
  Ethernet7/1: { profile: mgmt_access, desc: MGMT_CTRL-EDGE }
  Ethernet8/1: { profile: mgmt_access, desc: MGMT_CTRL-EDGE }
  # 2110 endpoints — rewired by the operator on 2026-10-24: every optic moved
  # to the odd port next to its old one. FEC off on every client port, and off
  # on the device end too (operator, 2026-10-24: "disable fec on switch and on
  # neuron too"). Rx light read on every port before the change (-0.8..+0.7 dBm);
  # device per port to be confirmed by LLDP once the links are up — only
  # Et25/1 identified (Neuron 0003.4120.4b9c, LR4).
  Ethernet9/1:  { profile: client_red,  desc: RED-CLIENT,  extra: [no error-correction encoding] }   # 100G DR
  Ethernet11/1: { profile: client_red,  desc: RED-CLIENT,  extra: [no error-correction encoding] }   # 100G SR4
  Ethernet13/1: { profile: client_red,  desc: RED-CLIENT,  extra: [no error-correction encoding] }   # 100G SR4
  Ethernet19/1: { profile: client_red,  desc: RED-CLIENT,  extra: [speed forced 25gfull, no error-correction encoding] }   # FusioN e1 (AR4 split, lane 1)
  Ethernet21/1: { profile: client_blue, desc: BLUE-CLIENT, extra: [no error-correction encoding] }   # 100G DR
  Ethernet23/1: { profile: client_blue, desc: BLUE-CLIENT, extra: [no error-correction encoding] }   # 100G SR4
  Ethernet25/1: { profile: client_blue, desc: BLUE-CLIENT, extra: [no error-correction encoding] }   # 100G LR4, Neuron 0003.4120.4b9c
  Ethernet31/1: { profile: client_blue, desc: BLUE-CLIENT, extra: [speed forced 25gfull, no error-correction encoding] }   # FusioN e2 (AR4 split, lane 1)
  # Uplinks to FABRIC-2 (profile, description and MST costs from site.yml `uplinks`)
  Ethernet33: { uplink: red }
  Ethernet34: { uplink: blue }

# Unused ports: parking VLAN (link + LLDP events, no reachability).
parked:
  - Ethernet10/1
  - Ethernet12/1
  - Ethernet14/1
  - { port: Ethernet15/1, extra: [no error-correction encoding] }
  - Ethernet16/1
  - Ethernet17/1
  - Ethernet18/1
  - { port: Ethernet19/2, extra: [no error-correction encoding] }
  - { port: Ethernet19/3, extra: [no error-correction encoding] }
  - { port: Ethernet19/4, extra: [no error-correction encoding] }
  - { port: Ethernet20/1, extra: [speed forced 25gfull, no error-correction encoding] }
  - { port: Ethernet20/2, extra: [no error-correction encoding] }
  - { port: Ethernet20/3, extra: [no error-correction encoding] }
  - { port: Ethernet20/4, extra: [no error-correction encoding] }
  - Ethernet22/1
  - Ethernet24/1
  - Ethernet26/1
  - Ethernet27/1
  - Ethernet28/1
  - Ethernet29/1
  - Ethernet30/1
  - { port: Ethernet31/2, extra: [no error-correction encoding] }
  - { port: Ethernet31/3, extra: [no error-correction encoding] }
  - { port: Ethernet31/4, extra: [no error-correction encoding] }
  - { port: Ethernet32/1, extra: [speed forced 25gfull, no error-correction encoding] }
  - { port: Ethernet32/2, extra: [no error-correction encoding] }
  - { port: Ethernet32/3, extra: [no error-correction encoding] }
  - { port: Ethernet32/4, extra: [no error-correction encoding] }

lags: []
