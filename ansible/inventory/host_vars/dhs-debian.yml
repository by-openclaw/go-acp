---
# dhs-debian — Proxmox LXC 651 "dhs.debian12", Debian 12 (bookworm).
# Single management NIC: eth0 10.100.0.101 (ansible_host) — mgmt-B (.111)
# was retired 2026-08-23 (#822).
# Roles: dhs producer host; BINARY-TEST target, held at the same 2 vCPU as
# .102/.103 so cross-distro binary benchmarks are comparable (#817).
# The Ansible control node moved to dhs-tools .104 (#820) — this host is an
# ordinary SSH target now, so NO ansible_connection: local here.

pve_vmid: 651
pve_name: dhs.debian12
pve_cores: 2          # P1 sizing (#817): binary-test host - SAME size as .102/.103 so cross-distro binary perf is comparable
os_label: "Debian 12"
nics:
  - { name: eth0, mac: "BC:24:11:80:E3:AC", ip: 10.100.0.101 }
fleet_hostname: dhs-debian

# Ember+ producer: our integration DM — the synthetic tree that carries the
# n-to-n matrix plus the salvo/lock/protect builtin functions.
ember_tree_src: "{{ playbook_dir }}/../files/trees/our-dm.tree.json"

# Connectors this host serves -> dhs_firewall opens exactly these rule groups
# (nmos also needs the dhs_mdns daemon). Add/remove with the producer deploy.
dhs_connectors: [acp1, acp2, emberplus, probel-sw08p, probel-sw02p, nmos]
