# dhs test fleet — Proxmox pve01 (10.6.224.5), bridge vmbrMGMT, VLAN 600
# MGMT_CTRL (10.6.240.0/20, gateway 10.6.255.254 fabric VRRP, no
# internet) since the 2026-08-29 migration. Source of truth for names,
# MACs and IPs is the Proxmox config (vmid per host_vars); docs/testbed.md
# is rendered from the same facts.
#
# NOTE: host_vars/*.yml still carry the retired 10.100.0.x static-address
# plan for the dhs_netaddr role — do NOT run dhs_netaddr until that role
# is reworked for VLAN 600 (addresses below are the live ones).
#
# Addressing is STATIC (dhs_netaddr role, #786): eth0 = mgmt-A (this
# ansible_host, default gateway), eth1 = eth0 + 10 (mgmt-B, no default
# route). No DHCP dependency.
#
# Linux LXC are reached over SSH as root; the Windows VM over SSH as the
# local admin-group user `by-rune` (key auth, no password file — #782).
# Control node = dhs-debian, see docs/testbed.md "Control node".

[linux]
dhs-debian  ansible_host=10.6.250.101
dhs-ubuntu  ansible_host=10.6.250.102
dhs-rocky   ansible_host=10.6.250.103
dhs-tools   ansible_host=10.6.250.104

[windows]
# dhs-win11 was re-addressed inside the guest during the VLAN 600
# migration; confirm its static before targeting windows plays.
win11       ansible_host=10.6.250.105

# Ansible control node (runs every play; never PowerShell drivers).
[control]
dhs-debian

# Proxmox node hosting the fleet — node-level plays only (pve-time.yml, #810).
[pve]
pve01  ansible_host=10.6.224.5

# Hosts that run vendor tooling (AMWA NMOS Testing tool in Docker).
[tooling]
dhs-tools

# dhs binary hosts: producers + consumer verbs per OS (ADR-0016 matrix).
[dhs_clients:children]
linux
windows
